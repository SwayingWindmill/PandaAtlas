[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panda-atlas-api"
version = "0.1.0"
description = "FastAPI backend for Panda Atlas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.3",
  "pyjwt[crypto]==2.13.0",
  "cryptography>=44.0.0",
  "httpx>=0.28.0",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
local-server = ["uvicorn[standard]>=0.30.0"]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.28.0",
  "ruff>=0.7.0",
  "pyyaml>=6.0.2",
  "pillow==12.3.0",
]
crawler-poc = [
    "httpx==0.28.1",
    "scrapling[fetchers]==0.4.8",
    "scrapy==2.17.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["openapi*"]

[tool.setuptools.package-data]
"app.notification" = ["templates/*/*.html", "templates/*/*.txt"]
"app.release_manifests" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/archive_workbench/service.py" = ["E501"]
"app/projection/approved_release_bootstrap.py" = ["E501"]
"app/review_moderation/service.py" = ["E501", "F841", "UP035"]
"tests/contracts/test_review_case_storage_contract.py" = ["I001"]
"tests/contracts/test_review_openapi_contract.py" = ["I001"]
"tests/integration/test_review_moderation_real_db.py" = ["E501"]
