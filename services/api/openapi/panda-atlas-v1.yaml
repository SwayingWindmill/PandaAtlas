components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ActorId:
      name: X-Actor-Id
      in: header
      required: true
      description: Authenticated staff actor responsible for this workflow action
      schema:
        type: string
        format: uuid
    ChangeSetId:
      name: change_set_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BatchId:
      name: batch_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    CommunitySubmissionState:
      type: string
      enum: [draft, submitted, withdrawn, expired, closed]

    CommunityAttachmentState:
      type: string
      enum: [quarantined, clean, infected, scan_failed, deleted]

    CreateCommunityDraftCommand:
      type: object
      additionalProperties: false
      required: [idempotency_key, submission_type, target_id, public_version_seen]
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 255 }
        submission_type: { type: string, enum: [correction, sourced_information] }
        target_type: { type: string, enum: [panda], default: panda }
        target_id: { type: string, format: uuid }
        public_version_seen: { type: string, minLength: 1, maxLength: 255 }
        draft_content: { type: object, additionalProperties: true, default: {} }

    UpdateCommunityDraftCommand:
      type: object
      additionalProperties: false
      required: [idempotency_key, expected_version, draft_content]
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 255 }
        expected_version: { type: integer, minimum: 1 }
        draft_content: { type: object, additionalProperties: true }
        public_version_seen: { type: string, minLength: 1, maxLength: 255 }

    CommunitySubmittedSource:
      type: object
      additionalProperties: false
      required: [source_kind, title, locator]
      properties:
        source_kind: { type: string, enum: [url, publication, document, other] }
        title: { type: string, minLength: 1, maxLength: 500 }
        locator: { type: string, minLength: 1, maxLength: 2000 }
        publisher: { type: string, maxLength: 500 }
        published_on: { type: string, format: date }

    SubmitCommunityRevisionCommand:
      type: object
      additionalProperties: false
      required: [idempotency_key, expected_version, content, public_version_seen]
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 255 }
        expected_version: { type: integer, minimum: 1 }
        content: { type: object, minProperties: 1, additionalProperties: true }
        public_version_seen: { type: string, minLength: 1, maxLength: 255 }
        sources:
          type: array
          maxItems: 25
          items: { $ref: '#/components/schemas/CommunitySubmittedSource' }

    WithdrawCommunitySubmissionCommand:
      type: object
      additionalProperties: false
      required: [idempotency_key, expected_version, reason]
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 255 }
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 3, maxLength: 1000 }

    PrepareCommunityAttachmentCommand:
      type: object
      additionalProperties: false
      required: [idempotency_key, original_filename, media_type, byte_size]
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 255 }
        original_filename: { type: string, minLength: 1, maxLength: 255 }
        media_type:
          type: string
          enum: [application/pdf, image/jpeg, image/png, image/webp]
        byte_size: { type: integer, minimum: 1, maximum: 10485760 }

    CompleteCommunityAttachmentCommand:
      type: object
      additionalProperties: false
      required: [idempotency_key, upload_reference, object_version, content_sha256]
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 255 }
        upload_reference:
          type: string
          minLength: 32
          maxLength: 4096
          description: Opaque reservation reference returned by the upload preparation command.
        object_version: { type: string, minLength: 1, maxLength: 255 }
        content_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }

    CommunityAttachmentScanCommand:
      type: object
      additionalProperties: false
      required: [idempotency_key, outcome, scanner_name, result_code]
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 255 }
        outcome: { type: string, enum: [clean, infected, scan_failed] }
        scanner_name: { type: string, minLength: 1, maxLength: 255 }
        scanner_version: { type: string, maxLength: 255 }
        result_code: { type: string, minLength: 1, maxLength: 255 }
        metadata_stripped: { type: boolean, default: false }
        preview_object_key:
          type: string
          description: Server-only scanner output; never returned in Attachment views.

    CommunityAttachmentAccessCommand:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose: { type: string, minLength: 3, maxLength: 500 }
        preview: { type: boolean, default: false }

    SignedStorageReference:
      type: object
      additionalProperties: false
      required: [reference, expires_at]
      properties:
        reference:
          type: string
          description: Opaque signed reference; contains no Storage bucket or object path.
        expires_at: { type: string, format: date-time }

    CommunityAttachment:
      type: object
      additionalProperties: false
      required:
        - attachment_id
        - submission_id
        - original_filename
        - media_type
        - byte_size
        - state
        - scan_attempts
        - metadata_stripped
        - created_at
      properties:
        attachment_id: { type: string, format: uuid }
        submission_id: { type: string, format: uuid }
        bound_revision_number: { type: integer, minimum: 1, nullable: true }
        original_filename: { type: string }
        media_type: { type: string }
        byte_size: { type: integer }
        state: { $ref: '#/components/schemas/CommunityAttachmentState' }
        upload_completed_at: { type: string, format: date-time, nullable: true }
        scan_attempts: { type: integer, minimum: 0 }
        last_scan_code: { type: string, nullable: true }
        last_scanned_at: { type: string, format: date-time, nullable: true }
        metadata_stripped: { type: boolean }
        created_at: { type: string, format: date-time }

    CommunityAttachmentReservation:
      type: object
      additionalProperties: false
      required: [attachment, upload_reference]
      properties:
        attachment: { $ref: '#/components/schemas/CommunityAttachment' }
        upload_reference: { $ref: '#/components/schemas/SignedStorageReference' }

    CommunitySubmission:
      type: object
      additionalProperties: false
      required:
        - submission_id
        - submission_type
        - target_type
        - target_id
        - public_version_seen
        - state
        - draft_content
        - version
        - latest_revision_number
        - expires_at
        - created_at
        - updated_at
        - revisions
        - attachments
      properties:
        submission_id: { type: string, format: uuid }
        submission_type: { type: string, enum: [correction, sourced_information] }
        target_type: { type: string, enum: [panda] }
        target_id: { type: string, format: uuid }
        public_version_seen: { type: string }
        state: { $ref: '#/components/schemas/CommunitySubmissionState' }
        draft_content: { type: object, additionalProperties: true }
        version: { type: integer, minimum: 1 }
        latest_revision_number: { type: integer, minimum: 0 }
        expires_at: { type: string, format: date-time }
        submitted_at: { type: string, format: date-time, nullable: true }
        withdrawn_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        retention_due_at: { type: string, format: date-time, nullable: true }
        retention_completed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        revisions: { type: array, items: { type: object, additionalProperties: true } }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/CommunityAttachment' }

    CommunityRetentionResult:
      type: object
      additionalProperties: false
      required: [expired_drafts, closed_submissions_processed, orphan_attachments, scan_retries]
      properties:
        expired_drafts: { type: integer, minimum: 0 }
        closed_submissions_processed: { type: integer, minimum: 0 }
        orphan_attachments: { type: integer, minimum: 0 }
        scan_retries: { type: integer, minimum: 0 }

    CommunityIntakeMetrics:
      type: object
      additionalProperties: false
      required:
        - draft_count
        - submitted_count
        - quarantined_count
        - scan_failed_count
        - infected_count
        - clean_count
        - oldest_quarantined_age_seconds
        - sensitive_reads_granted
        - sensitive_reads_denied
      properties:
        draft_count: { type: integer, minimum: 0 }
        submitted_count: { type: integer, minimum: 0 }
        quarantined_count: { type: integer, minimum: 0 }
        scan_failed_count: { type: integer, minimum: 0 }
        infected_count: { type: integer, minimum: 0 }
        clean_count: { type: integer, minimum: 0 }
        oldest_quarantined_age_seconds: { type: number, minimum: 0 }
        sensitive_reads_granted: { type: integer, minimum: 0 }
        sensitive_reads_denied: { type: integer, minimum: 0 }

    AssertionDisposition:
      type: string
      enum:
      - pending
      - selected
      - not_selected
      - incorporated
      - not_incorporated
      - superseded
      title: AssertionDisposition
    AssertionResultInput:
      properties:
        assertion_key:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}$
          title: Assertion Key
        disposition:
          $ref: '#/components/schemas/AssertionDisposition'
        explanation:
          anyOf:
          - type: string
            maxLength: 2000
            minLength: 3
          - type: 'null'
          title: Explanation
        public_reference_id:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Public Reference Id
      additionalProperties: false
      type: object
      required:
      - assertion_key
      - disposition
      title: AssertionResultInput
    AssertionResultView:
      properties:
        assertion_key:
          type: string
          title: Assertion Key
        revision_number:
          type: integer
          title: Revision Number
        disposition:
          $ref: '#/components/schemas/AssertionDisposition'
        explanation:
          anyOf:
          - type: string
          - type: 'null'
          title: Explanation
        public_reference_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Public Reference Id
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - assertion_key
      - revision_number
      - disposition
      - explanation
      - public_reference_id
      - created_at
      title: AssertionResultView
    AttachmentState:
      type: string
