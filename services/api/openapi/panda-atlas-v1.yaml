openapi: 3.1.0
info:
  title: Panda Atlas API
  version: 0.1.0-draft
  summary: Draft contract for Panda Atlas backend service
  description: |
    API draft for a panda encyclopedia and distribution map service.
    This contract is intended for FastAPI implementation and frontend integration.
servers:
  - url: https://panda-atlas-api.example.workers.dev
    description: Cloudflare Worker API
  - url: https://api.example.com
    description: Container API
  - url: http://localhost:8000
    description: Local FastAPI development
  - url: http://127.0.0.1:8787
    description: Local Cloudflare Worker development

tags:
  - name: health
  - name: pandas
  - name: map
  - name: stats
  - name: admin
  - name: admin-accountable-publication
  - name: admin-community-curation
  - name: admin-review
  - name: feed
  - name: notification
  - name: moments
  - name: family-stories

paths:
  /health:
    get:
      tags: [health]
      summary: Service health check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 0.1.0
                  db:
                    type: string
                    description: Database health state
                    enum: [ok, disabled, error, driver_missing]
                    example: ok

  /api/v1/pandas:
    get:
      tags: [pandas]
      summary: List pandas
      operationId: listPandas
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: q
          in: query
          schema:
            type: string
          description: Search keyword for reviewed Chinese/English names, pinyin, aliases, legacy slugs, external identifiers, or tags. The trusted fallback projection includes all seven Mei Xiang–Tian Tian family records.
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PandaStatus'
        - name: gender
          in: query
          schema:
            type: string
            enum: [male, female, unknown]
        - name: habitat_id
          in: query
          description: Filter pandas linked to the given habitat through sightings or fallback habitat summaries
          schema:
            type: string
            format: uuid
        - name: featured
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [name_asc, name_desc, birth_date_desc, created_at_desc]
            default: created_at_desc
      responses:
        '200':
          description: Paginated panda list from the active immutable release
          headers: &PublicReleaseHeaders
            X-PandaAtlas-Dataset-Version:
              schema: { type: string }
            X-PandaAtlas-Public-Schema-Version:
              schema: { type: string }
            X-PandaAtlas-Database-Migration-Version:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPandasResponse'
        '410': &PublicReleaseWithdrawn
          description: Current public release was withdrawn
        '503': &PublicReleaseUnavailable
          description: Active public release or its immutable API snapshot is unavailable

  /api/v1/pandas/{panda_ref}:
    get:
      tags: [pandas]
      summary: Get panda detail
      operationId: getPandaByRef
      parameters:
        - name: panda_ref
          in: path
          required: true
          description: Canonical panda slug, reviewed legacy slug, stable UUID, or external identity reference
          schema:
            type: string
            examples: [he-hua, 1d08f72f-7550-42e9-a4d5-bd74bc505955]
      responses:
        '200':
          description: Panda detail, including the trusted seven-family public projection when the database fallback is active
          headers: *PublicReleaseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PandaDetail'
        '404':
          description: Panda not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410': *PublicReleaseWithdrawn
        '503': *PublicReleaseUnavailable

  /api/v1/pandas/{panda_ref}/profile:
    get:
      tags: [pandas]
      summary: Get the versioned Panda Profile V2 read model
      operationId: getPandaProfileV2ByRef
      parameters:
        - name: panda_ref
          in: path
          required: true
          description: Canonical panda slug, reviewed legacy slug, stable UUID, or external identity reference
          schema:
            type: string
      responses:
        '200':
          description: Panda Profile V2 with module states, reviewed parentage, places, facilities, institutions, and related journeys
          headers: *PublicReleaseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfileV2Response'
        '404':
          description: Panda not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410': *PublicReleaseWithdrawn
        '503': *PublicReleaseUnavailable

  /api/v1/moments:
    get:
      tags: [moments]
      summary: List unique public events and optional derived anniversaries
      operationId: listPublicMoments
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
        - name: year
          in: query
          schema: { type: integer, minimum: 1800, maximum: 2200 }
        - name: panda_ref
          in: query
          description: Canonical panda slug or stable identity reference
          schema: { type: string }
        - name: event_type
          in: query
          schema: { type: string }
        - name: event_status
          in: query
          schema: { type: string }
        - name: include_anniversaries
          in: query
          description: Include derived birthday occurrences linked to their source birth event. Derived occurrences never increase source-event totals.
          schema: { type: boolean, default: false }
        - name: sort
          in: query
          schema:
            type: string
            enum: [date_asc, date_desc]
            default: date_asc
      responses:
        '200':
          description: Paginated source events and derived occurrences from the active immutable release
          headers: *PublicReleaseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMomentsResponse'
        '404':
          description: Referenced panda was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410': *PublicReleaseWithdrawn
        '503': *PublicReleaseUnavailable

  /api/v1/family-stories:
    get:
      tags: [family-stories]
      summary: List reviewed Family Story read models
      operationId: listPublicFamilyStories
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Paginated family-story summaries from the active immutable release
          headers: *PublicReleaseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicFamilyStoryListResponse'
        '410': *PublicReleaseWithdrawn
        '503': *PublicReleaseUnavailable

  /api/v1/family-stories/{story_ref}:
    get:
      tags: [family-stories]
      summary: Get a reviewed Family Story with canonical members, events, assertions, and sources
      operationId: getPublicFamilyStoryByRef
      parameters:
        - name: story_ref
          in: path
          required: true
          description: Canonical family-story slug or stable story ID
          schema: { type: string }
      responses:
        '200':
          description: Expanded family-story read model
          headers: *PublicReleaseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicFamilyStoryResponse'
        '404':
          description: Family story not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410': *PublicReleaseWithdrawn
        '503': *PublicReleaseUnavailable

  /api/v1/pandas/{panda_ref}/lineage:
    get:
      tags: [pandas]
      summary: Get panda lineage graph around a focus panda
      operationId: getPandaLineageByRef
      parameters:
        - name: panda_ref
          in: path
          required: true
          description: Canonical panda slug or legacy UUID alias
          schema:
            type: string
            examples: [he-hua, 1d08f72f-7550-42e9-a4d5-bd74bc505955]
        - name: ancestor_depth
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 16
            default: 6
        - name: descendant_depth
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 16
            default: 6
      responses:
        '200':
          description: Lineage graph centered on the target panda
          headers: *PublicReleaseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PandaLineageResponse'
        '404':
          description: Panda not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410': *PublicReleaseWithdrawn
        '503': *PublicReleaseUnavailable

  /api/v1/map/distribution:
    get:
      tags: [map]
      summary: Get distribution GeoJSON in a bounding box
      operationId: getDistribution
      parameters:
        - name: bbox
          in: query
          required: true
          description: minLon,minLat,maxLon,maxLat (EPSG:4326)
          schema:
            type: string
            example: '102.0,27.5,108.8,34.2'
        - name: snapshot_date
          in: query
          schema:
            type: string
            format: date
          description: Uses latest snapshot when omitted
        - name: layer
          in: query
          schema:
            $ref: '#/components/schemas/DistributionLayer'
        - name: zoom
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 22
      responses:
        '200':
          description: Distribution features
          headers: *PublicReleaseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionFeatureCollection'
        '410': *PublicReleaseWithdrawn
        '503': *PublicReleaseUnavailable

  /api/v1/map/habitats:
    get:
      tags: [map]
      summary: Get habitat polygons
      operationId: getHabitats
      parameters:
        - name: bbox
          in: query
          schema:
            type: string
            example: '102.0,27.5,108.8,34.2'
        - name: level
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Habitat polygons in GeoJSON
          headers: *PublicReleaseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitatFeatureCollection'
        '410': *PublicReleaseWithdrawn
        '503': *PublicReleaseUnavailable

  /api/v1/map/snapshots:
    get:
      tags: [map]
      summary: List available distribution snapshots
      operationId: listDistributionSnapshots
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 120
            default: 24
      responses:
        '200':
          description: Snapshot metadata list
          headers: *PublicReleaseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionSnapshotList'
        '410': *PublicReleaseWithdrawn
        '503': *PublicReleaseUnavailable

  /api/v1/stats/overview:
    get:
      tags: [stats]
      summary: Get dashboard overview metrics
      operationId: getOverviewStats
      responses:
        '200':
          description: Overview metrics scoped to the active immutable release
          headers: *PublicReleaseHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewStats'
        '410': *PublicReleaseWithdrawn
        '503': *PublicReleaseUnavailable

  /api/v1/admin/import-sources:
    get:
      tags: [admin]
      summary: List approved import sources
      operationId: listImportSources
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Approved import sources for local operator workflows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSourceList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Admin token is still using the unsafe default outside development
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/import-jobs:
    post:
      tags: [admin]
      summary: Create an import job
      operationId: createImportJob
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateImportJobRequest'
      responses:
        '201':
          description: Import job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Import source is not approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Admin token is still using the unsafe default outside development
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/import-jobs/{job_id}:
    get:
      tags: [admin]
      summary: Get import job status
      operationId: getImportJob
      security:
        - BearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Import job detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Admin token is still using the unsafe default outside development
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/import-jobs/{job_id}/run:
    post:
      tags: [admin]
      summary: Execute import job
      operationId: runImportJob
      security:
        - BearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Import job execution finished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Job cannot be run from its current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Admin token is still using the unsafe default outside development
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/change-sets:
    post:
      tags: [admin-publication]
      summary: Create a legacy four-eyes draft change set with immutable entity revisions
      operationId: createChangeSet
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChangeSetRequest'
      responses:
        '201':
          description: Draft change set created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeSet'
        '401':
          description: Unauthorized
        '422':
          description: Invalid change set
        '503':
          description: Authoritative database unavailable

  /api/v1/admin/change-sets/{change_set_id}/submit:
    post:
      tags: [admin-publication]
      summary: Submit a legacy draft change set for independent review
      operationId: submitChangeSet
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/ChangeSetId'
      responses:
        '200':
          description: Change set submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeSet'
        '404':
          description: Change set not found
        '409':
          description: Invalid state transition

  /api/v1/admin/change-sets/{change_set_id}/reviews:
    post:
      tags: [admin-publication]
      summary: Record a legacy independent review decision
      operationId: reviewChangeSet
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/ChangeSetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewChangeSetRequest'
      responses:
        '200':
          description: Review recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeSet'
        '404':
          description: Change set not found
        '409':
          description: Self-review, invalid transition, or archive governance migration required

  /api/v1/admin/publication-batches:
    post:
      tags: [admin-publication]
      summary: Group approved change sets into a publication batch
      operationId: createPublicationBatch
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicationBatchRequest'
      responses:
        '201':
          description: Draft publication batch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationBatch'
        '409':
          description: Batch contains a change set that is not approved

  /api/v1/admin/publication-batches/{batch_id}/preview:
    get:
      tags: [admin-publication]
      summary: Preview blocking publication integrity problems
      operationId: previewPublicationBatch
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Publication preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationPreview'
        '404':
          description: Publication batch not found

  /api/v1/admin/publication-batches/{batch_id}/publish:
    post:
      tags: [admin-publication]
      summary: Atomically publish a clean batch and switch the public version
      operationId: publishPublicationBatch
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Immutable published batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationBatch'
        '409':
          description: Batch is immutable or has blocking preview issues

  /api/v1/admin/publication-batches/{batch_id}/rollback:
    post:
      tags: [admin-publication]
      summary: Create an append-only release that rolls back to a published batch
      operationId: rollbackPublicationBatch
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/BatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationActionRequest'
      responses:
        '201':
          description: Rollback release published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationBatch'
        '409':
          description: Rollback target is not a published batch

  /api/v1/admin/publication-batches/{batch_id}/withdraw:
    post:
      tags: [admin-publication]
      summary: Create an append-only emergency withdrawal release
      operationId: withdrawPublicationBatch
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/BatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationActionRequest'
      responses:
        '201':
          description: Emergency withdrawal release published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationBatch'
        '409':
          description: Withdrawal target is not a published batch

  /api/v1/releases/current:
    get:
      tags: [releases]
      summary: Get the immutable public release currently served by all public surfaces
      responses:
        '200':
          description: Current public release metadata
          headers:
            X-PandaAtlas-Dataset-Version:
              schema: { type: string }
            X-PandaAtlas-Public-Schema-Version:
              schema: { type: string }
            X-PandaAtlas-Database-Migration-Version:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicReleaseMetadata'
        '410':
          description: Current release was withdrawn

  /api/v1/releases/current/pandas:
    get:
      tags: [releases]
      summary: Get panda records from the immutable current public release
      responses:
        '200':
          description: Current release panda snapshot
          headers:
            X-PandaAtlas-Dataset-Version:
              schema: { type: string }
            X-PandaAtlas-Public-Schema-Version:
              schema: { type: string }
            X-PandaAtlas-Database-Migration-Version:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPandaRelease'
        '410':
          description: Current release was withdrawn
        '503':
          description: Release artifact is unavailable or mismatched


  /api/v1/me/feed:
    get:
      tags: [feed]
      summary: Read the authenticated account's chronological Feed
      operationId: getPersonalizedFeed
      security:
        - BearerAuth: []
      parameters:
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          description: Opaque account-bound signed cursor. Offset pagination is not supported.
          schema: { type: string, minLength: 8, maxLength: 2048 }
      responses:
        '200':
          description: Current Follow-derived Feed, current pins, and explicit tombstones
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
            X-Feed-Projection-Lag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPage'
        '400': { description: Cursor is invalid or belongs to another account }
        '401': { description: Authentication is required }
        '403': { description: Account state blocks Feed access }
        '503': { description: Feed database or projection is unavailable }

  /api/v1/me/feed/last-viewed:
    post:
      tags: [feed]
      summary: Explicitly mark the authenticated Feed viewed through a timestamp
      operationId: markFeedLastViewed
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedLastViewedCommand'
      responses:
        '200':
          description: Idempotent account-scoped last-viewed state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedLastViewedState'
        '401': { description: Authentication is required }
        '403': { description: Account state blocks Feed commands }
        '409': { description: Idempotency conflict or invalid future timestamp }
        '503': { description: Feed command database is unavailable }

  /api/v1/pandas/{panda_id}/activity:
    get:
      tags: [feed, pandas]
      summary: Read public Activity for one stable Panda identity
      operationId: getPublicPandaActivity
      parameters:
        - name: panda_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - name: cursor
          in: query
          description: Opaque target-bound signed cursor
          schema: { type: string, minLength: 8, maxLength: 2048 }
      responses:
        '200':
          description: Chronological public-safe Activity including explicit retraction tombstones
          headers:
            Cache-Control:
              schema: { type: string, example: "public, max-age=60, stale-while-revalidate=300" }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '400': { description: Cursor is invalid or belongs to another Panda target }
        '503': { description: Activity database is unavailable }

  /api/v1/feed/metrics:
    get:
      tags: [feed]
