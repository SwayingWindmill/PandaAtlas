openapi: 3.1.0
info:
  title: ZhiPanda Archive Workbench API
  version: 1.0.0-draft
  description: >-
    Bounded read models and explicit migration cutover commands for Archive Editor
    and Senior Archive Editor workbenches. Generic CRUD is not exposed.
paths:
  /api/v1/admin/archive/workbench:
    get:
      tags: [admin-archive-workbench]
      operationId: listArchiveWorkbench
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: queue
          schema:
            type: string
            enum: [all, ordinary_ready, sensitive_ready, publish_failed, projection_lag, targeted_correction, retraction, rollback, merge, split, emergency_followup]
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Bounded workbench queue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveWorkbenchListRead' }
        '403': { description: Workbench capability required }
        '404': { description: Accountable Archive feature disabled }
        '503': { description: Authoritative database unavailable }

  /api/v1/admin/archive/workbench/metrics:
    get:
      tags: [admin-archive-workbench]
      operationId: getArchiveWorkbenchMetrics
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Queue and cutover metrics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveWorkbenchMetricsRead' }

  /api/v1/admin/archive/workbench/items/{item_id}:
    get:
      tags: [admin-archive-workbench]
      operationId: getArchiveWorkbenchItem
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: item_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Complete evidence and public impact read model.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveWorkbenchDetailRead' }
        '404': { description: Workbench item not found }

  /api/v1/admin/archive/workbench/cutover:
    get:
      tags: [admin-archive-workbench]
      operationId: getArchiveCutoverControl
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Current publication cutover control.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveCutoverControlRead' }
    post:
      tags: [admin-archive-workbench]
      operationId: setArchiveCutoverControl
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveCutoverCommand' }
      responses:
        '200':
          description: Versioned hold or resume result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveCutoverControlRead' }
        '403': { description: Senior capability and recent authentication required }
        '409': { description: Idempotency or cutover version conflict }

  /api/v1/admin/archive/workbench/rehearsal-snapshot:
    get:
      tags: [admin-archive-workbench]
      operationId: getArchiveRehearsalSnapshot
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Deterministic migration comparison and GO/NO-GO snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveRehearsalSnapshotRead' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ArchiveWorkbenchItemRead:
      type: object
      additionalProperties: false
      required: [item_type, item_id, queue, title, status, risk_level, version, created_at, updated_at]
      properties:
        item_type: { type: string, enum: [change_set, release, operation] }
        item_id: { type: string, format: uuid }
        queue: { type: string }
        title: { type: string }
        status: { type: string }
        risk_level: { type: string, enum: [ordinary, sensitive] }
        version: { type: integer, minimum: 1 }
        base_archive_version: { anyOf: [{ type: string }, { type: 'null' }] }
        release_id: { anyOf: [{ type: string, format: uuid }, { type: 'null' }] }
        operation_id: { anyOf: [{ type: string, format: uuid }, { type: 'null' }] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ArchiveWorkbenchListRead:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ArchiveWorkbenchItemRead' } }
        total: { type: integer, minimum: 0 }
    ArchiveWorkbenchMetricsRead:
      type: object
      required: [ordinary_ready, sensitive_ready, publish_failed, projection_lag, emergency_followup, cutover_state, cutover_version]
      properties:
        ordinary_ready: { type: integer, minimum: 0 }
        sensitive_ready: { type: integer, minimum: 0 }
        publish_failed: { type: integer, minimum: 0 }
        projection_lag: { type: integer, minimum: 0 }
        emergency_followup: { type: integer, minimum: 0 }
        cutover_state: { type: string, enum: [open, held] }
        cutover_version: { type: integer, minimum: 1 }
    ArchiveCutoverControlRead:
      type: object
      required: [state, version, reason, changed_at]
      properties:
        state: { type: string, enum: [open, held] }
        version: { type: integer, minimum: 1 }
        reason: { type: string }
        changed_by: { anyOf: [{ type: string, format: uuid }, { type: 'null' }] }
        changed_at: { type: string, format: date-time }
    ArchiveCutoverCommand:
      type: object
      additionalProperties: false
      required: [expected_version, state, idempotency_key, reason, correlation_id]
      properties:
        expected_version: { type: integer, minimum: 1 }
        state: { type: string, enum: [open, held] }
        idempotency_key: { type: string, minLength: 8, maxLength: 255 }
        reason: { type: string, minLength: 3, maxLength: 2000 }
        correlation_id: { type: string, format: uuid }
    ArchiveWorkbenchDetailRead:
      type: object
      required: [item, current_archive_version, current_public_version, validation_issues, structured_diff, source_evidence, attachment_evidence, public_impact, operation_effect, actor_roles, actor_capabilities]
      properties:
        item: { $ref: '#/components/schemas/ArchiveWorkbenchItemRead' }
        current_archive_version: { type: string }
        current_public_version: { type: string }
        change_set_id: { anyOf: [{ type: string, format: uuid }, { type: 'null' }] }
        governance_mode: { anyOf: [{ type: string }, { type: 'null' }] }
        validation_state: { anyOf: [{ type: string }, { type: 'null' }] }
        validation_hash: { anyOf: [{ type: string }, { type: 'null' }] }
        validation_issues: { type: array, items: { type: object } }
        structured_diff: { type: array, items: { type: object } }
        source_evidence: { type: array, items: { type: object } }
        attachment_evidence: { type: array, items: { type: object } }
        release_notes: { anyOf: [{ type: string }, { type: 'null' }] }
        public_impact: { type: object }
        operation_effect: { type: object }
        operation_subject: { anyOf: [{ type: object }, { type: 'null' }] }
        actor_roles: { type: array, items: { type: string } }
        actor_capabilities: { type: array, items: { type: string } }
        emergency_followup_due_at: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
        emergency_followup_change_set_id: { anyOf: [{ type: string, format: uuid }, { type: 'null' }] }
    ArchiveRehearsalSnapshotRead:
      type: object
      required: [generated_at, old_state_counts, accountable_state_counts, release_counts, orphan_counts, historical_audit_count, canonical_sha256, go, blockers]
      properties:
        generated_at: { type: string, format: date-time }
        old_state_counts: { type: object, additionalProperties: { type: integer } }
        accountable_state_counts: { type: object, additionalProperties: { type: integer } }
        release_counts: { type: object, additionalProperties: { type: integer } }
        orphan_counts: { type: object, additionalProperties: { type: integer } }
        historical_audit_count: { type: integer, minimum: 0 }
        archive_pointer_release_id: { anyOf: [{ type: string, format: uuid }, { type: 'null' }] }
        public_pointer_release_id: { anyOf: [{ type: string, format: uuid }, { type: 'null' }] }
        canonical_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        go: { type: boolean }
        blockers: { type: array, items: { type: string } }
