openapi: 3.1.0
info:
  title: Panda Atlas Accountable Archive Publication API
  version: 1.0.0-draft
  description: Domain contract for validation and atomic single-accountable-approver publication.
paths:
  /api/v1/admin/archive/change-sets/{change_set_id}/validate:
    post:
      tags: [admin-accountable-publication]
      operationId: validateAccountableArchiveChangeSet
      summary: Validate one Change Set against the authoritative Archive head
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChangeSetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountableValidationCommand'
      responses:
        '200':
          description: Append-only validation result; ready is not a public fact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountableValidation'
        '403': { description: Account or validation capability is unavailable }
        '404': { description: Feature or Change Set is unavailable }
        '409': { description: Idempotency, version, base, state, or validation conflict }
        '503': { description: Authoritative database unavailable }

  /api/v1/admin/archive/change-sets/{change_set_id}/publish:
    post:
      tags: [admin-accountable-publication]
      operationId: publishAccountableArchiveChangeSet
      summary: Atomically publish one ready Change Set and transactional Outbox event
      description: |
        Advances the authoritative Archive pointer but not the public Release pointer.
        Sensitive publication additionally requires Senior capability and recent authentication.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChangeSetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountablePublishCommand'
      responses:
        '200':
          description: Immutable authoritative Release with pending or completed public projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountableRelease'
        '403': { description: Capability, recent-auth, or self-publication policy denied }
        '404': { description: Feature or Change Set is unavailable }
        '409': { description: Idempotency, version, base, validation, data-version, or state conflict }
        '503': { description: Authoritative database unavailable }

  /api/v1/admin/archive/publication-metrics:
    get:
      tags: [admin-accountable-publication]
      operationId: getAccountableArchivePublicationMetrics
      summary: Read validation, publication, Outbox, and projection-lag metrics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current accountable publication metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchivePublicationMetrics'
        '403': { description: Metrics capability is unavailable }
        '404': { description: Feature is disabled }
        '503': { description: Authoritative database unavailable }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ChangeSetId:
      name: change_set_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ArchiveRiskLevel:
      type: string
      enum: [ordinary, sensitive]
    AccountableValidationCommand:
      type: object
      additionalProperties: false
      required:
        - expected_version
        - idempotency_key
        - base_archive_version
        - reason
        - risk_level
        - correlation_id
      properties:
        expected_version: { type: integer, minimum: 1 }
        idempotency_key: { type: string, minLength: 8, maxLength: 255 }
        base_archive_version: { type: string, minLength: 1, maxLength: 120 }
        reason: { type: string, minLength: 3, maxLength: 2000 }
        risk_level: { $ref: '#/components/schemas/ArchiveRiskLevel' }
        correlation_id: { type: string, format: uuid }
    AccountablePublishCommand:
      type: object
      additionalProperties: false
      required:
        - expected_version
        - idempotency_key
        - reason
        - data_version
        - correlation_id
      properties:
        expected_version: { type: integer, minimum: 1 }
        idempotency_key: { type: string, minLength: 8, maxLength: 255 }
        reason: { type: string, minLength: 3, maxLength: 2000 }
        data_version: { type: string, minLength: 1, maxLength: 120 }
        public_schema_version: { type: string, const: 1.0.0, default: 1.0.0 }
        database_migration_version: { type: string, default: '0020' }
        projection_code_version: { type: string, default: public-release-v2 }
        correlation_id: { type: string, format: uuid }
    ArchiveValidationIssue:
      type: object
      additionalProperties: false
      required: [category, entity_type, entity_id, detail]
      properties:
        category: { type: string }
        entity_type: { type: string }
        entity_id: { type: string }
        detail: { type: string }
    AccountableValidation:
      type: object
      required:
        - validation_result_id
        - change_set_id
        - outcome
        - risk_level
        - base_archive_version
        - validation_hash
        - governance_version
        - validated_by
        - validated_at
        - reason
        - issues
      properties:
        validation_result_id: { type: string, format: uuid }
        change_set_id: { type: string, format: uuid }
        outcome: { type: string, enum: [validation_failed, ready] }
        risk_level: { $ref: '#/components/schemas/ArchiveRiskLevel' }
        base_archive_version: { type: string }
        validation_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        governance_version: { type: integer, minimum: 1 }
        validated_by: { type: string, format: uuid }
        validated_at: { type: string, format: date-time }
        reason: { type: string }
        issues:
          type: array
          items: { $ref: '#/components/schemas/ArchiveValidationIssue' }
    AccountableRelease:
      type: object
      required:
        - release_id
        - change_set_id
        - data_version
        - public_schema_version
        - database_migration_version
        - projection_code_version
        - base_archive_version
        - risk_level
        - published_by
        - published_at
        - correlation_id
        - outbox_event_id
        - public_projection_status
      properties:
        release_id: { type: string, format: uuid }
        change_set_id: { type: string, format: uuid }
        data_version: { type: string }
        public_schema_version: { type: string }
        database_migration_version: { type: string }
        projection_code_version: { type: string }
        base_archive_version: { type: string }
        previous_release_id: { type: [string, 'null'], format: uuid }
        risk_level: { $ref: '#/components/schemas/ArchiveRiskLevel' }
        published_by: { type: string, format: uuid }
        published_at: { type: string, format: date-time }
        correlation_id: { type: string, format: uuid }
        outbox_event_id: { type: string, format: uuid }
        public_projection_status: { type: string, enum: [pending, projected] }
    ArchivePublicationMetrics:
      type: object
      required:
        - ready_change_sets
        - published_change_sets
        - publish_failed_change_sets
        - stale_base_failures
        - conflict_failures
        - pending_outbox_events
        - oldest_outbox_lag_seconds
        - projection_lag_releases
      properties:
        ready_change_sets: { type: integer, minimum: 0 }
        published_change_sets: { type: integer, minimum: 0 }
        publish_failed_change_sets: { type: integer, minimum: 0 }
        stale_base_failures: { type: integer, minimum: 0 }
        conflict_failures: { type: integer, minimum: 0 }
        pending_outbox_events: { type: integer, minimum: 0 }
        oldest_outbox_lag_seconds: { type: integer, minimum: 0 }
        projection_lag_releases: { type: integer, minimum: 0 }
