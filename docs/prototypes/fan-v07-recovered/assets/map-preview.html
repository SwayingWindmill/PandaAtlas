<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>吱熊猫 · 地图预览</title>
  <style>
    :root{--ink:#151513;--muted:#6f6b63;--bg:#e7eae6;--paper:#fbfaf6;--yellow:#e7b92f;--ocean:#dbe3e6;--land:#f3f0e8;--line:#9da49f}
    *{box-sizing:border-box} body{margin:0;background:#f3f1eb;color:var(--ink);font-family:"Segoe UI Variable","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
    .wrap{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:72px 0 90px}.eyebrow{font-size:14px;font-weight:800;color:#5f5b54}.head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:24px}.head h1{margin:12px 0 0;font-size:clamp(42px,5.5vw,76px);line-height:.95;letter-spacing:-.06em}.head a{font-size:14px;font-weight:800;color:inherit;text-decoration:none}.map{position:relative;height:min(66vh,640px);min-height:520px;border:1px solid rgba(21,21,19,.14);border-radius:18px;overflow:hidden;background:var(--ocean);box-shadow:0 22px 60px rgba(20,20,18,.08)}
    svg{display:block;width:100%;height:100%}.grid path{stroke:rgba(74,85,84,.08);stroke-width:1;fill:none}.land path{fill:var(--land);stroke:var(--line);stroke-width:1.3;vector-effect:non-scaling-stroke}.islands{fill:var(--land);stroke:var(--line);stroke-width:1}.point{cursor:pointer}.point .halo{fill:rgba(231,185,47,.2);stroke:rgba(21,21,19,.2)}.point .core{fill:var(--ink);stroke:#fff;stroke-width:2}.point.active .halo{fill:rgba(231,185,47,.38);stroke:var(--yellow);stroke-width:2}.point.active .core{fill:var(--yellow);stroke:var(--ink);stroke-width:2}.card{position:absolute;left:22px;bottom:22px;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;width:min(390px,calc(100% - 44px));padding:14px;border:1px solid rgba(21,21,19,.1);border-radius:14px;background:rgba(251,250,246,.95);box-shadow:0 12px 32px rgba(20,20,18,.13);backdrop-filter:blur(12px)}.icon{width:48px;height:48px;display:grid;place-items:center;border-radius:12px;background:var(--yellow);font-size:20px}.card strong,.card span{display:block}.card strong{font-size:16px}.card span{margin-top:3px;color:var(--muted);font-size:12px}.card a{color:inherit;font-size:12px;font-weight:900;text-decoration:none}.legend{position:absolute;right:22px;top:22px;display:grid;gap:6px;padding:8px;border:1px solid rgba(21,21,19,.09);border-radius:12px;background:rgba(251,250,246,.9);backdrop-filter:blur(10px)}.legend button{border:0;border-radius:8px;background:transparent;padding:8px 10px;text-align:left;font:inherit;font-size:12px;color:#5f5b53;cursor:pointer}.legend button.active{background:#ede8da;color:var(--ink);font-weight:800}.note{margin-top:16px;color:#77726a;font-size:12px}
    @media(max-width:700px){.wrap{padding-top:36px}.head{align-items:flex-start;flex-direction:column}.map{min-height:460px}.legend{display:none}.card{grid-template-columns:42px 1fr}.card a{grid-column:2}.icon{width:42px;height:42px}.head h1{font-size:48px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="head">
      <div><div class="eyebrow">熊猫在哪里</div><h1>在地图上继续逛熊猫。</h1></div>
      <a href="/zh/map">打开完整地图 →</a>
    </div>
    <section class="map" aria-label="熊猫地点世界地图">
      <svg viewBox="0 0 1000 520" role="img" aria-label="世界地图与熊猫地点">
        <rect width="1000" height="520" fill="#dbe3e6" />
        <g class="grid"><path d="M0 130H1000M0 260H1000M0 390H1000"/><path d="M250 0V520M500 0V520M750 0V520"/></g>
        <g class="land">
          <path d="M82 112C116 77 173 56 230 66L274 92L315 95L333 125L299 149L270 176L233 184L205 214L167 216L151 196L120 186L105 156L78 142Z"/>
          <path d="M278 211L306 224L323 263L316 301L335 328L319 365L300 407L279 442L264 421L267 381L250 345L246 302L256 268L244 238Z"/>
          <path d="M355 76L387 64L409 82L399 106L366 116L347 98Z"/>
          <path d="M447 129L468 111L501 110L518 126L513 145L486 151L468 144Z"/>
          <path d="M480 166L514 153L548 162L567 189L561 226L577 252L563 291L540 327L512 323L500 287L480 265L468 229L471 195Z"/>
          <path d="M514 106L562 83L625 78L674 90L720 86L774 106L817 131L842 159L825 183L785 185L756 203L714 198L681 211L644 201L607 177L573 168L548 145L520 142Z"/>
          <path d="M746 212L769 216L786 233L778 252L755 248L742 231Z"/>
          <path d="M814 327L846 314L882 324L904 350L891 380L860 395L828 386L807 358Z"/>
          <path d="M902 220L912 225L918 243L909 253L900 240Z"/>
          <path d="M891 270L900 275L905 287L896 295L888 284Z"/>
        </g>
        <g class="islands"><circle cx="926" cy="170" r="4"/><circle cx="938" cy="185" r="3"/><circle cx="796" cy="242" r="4"/><circle cx="811" cy="249" r="3"/><circle cx="837" cy="262" r="2.5"/></g>
        <g id="points"></g>
      </svg>
      <div class="legend" id="legend"></div>
      <div class="card">
        <div class="icon">⌖</div>
        <div><strong id="title">Wolong, Sichuan</strong><span id="subtitle">2 条公开地图记录</span></div>
        <a id="open" href="/zh/map">查看 →</a>
      </div>
    </section>
    <div class="note">地点使用审核后的公开地图锚点；这里只验证首页地图的视觉和交互方向。</div>
  </main>
<script>
const locations=[
  {id:'wolong',title:'Wolong, Sichuan',subtitle:'2 条公开地图记录',lng:103.2,lat:31.0,href:'/zh/map'},
  {id:'smithsonian',title:'Smithsonian National Zoo',subtitle:'公开熊猫地点',lng:-77.05,lat:38.93,href:'/zh/map'}
];
const W=1000,H=520; let selected=locations[0].id;
const project=([lng,lat])=>({x:(lng+180)/360*W,y:(90-lat)/180*H});
const points=document.getElementById('points'),legend=document.getElementById('legend');
function render(){
  points.innerHTML=''; legend.innerHTML='';
  locations.forEach(loc=>{
    const {x,y}=project([loc.lng,loc.lat]); const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('transform',`translate(${x} ${y})`); g.setAttribute('class',`point ${loc.id===selected?'active':''}`); g.setAttribute('tabindex','0'); g.setAttribute('role','button'); g.setAttribute('aria-label',loc.title);
    g.innerHTML=`<circle class="halo" r="${loc.id===selected?14:11}"></circle><circle class="core" r="${loc.id===selected?7:5.5}"></circle>`;
    g.addEventListener('click',()=>select(loc.id)); g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(loc.id)}}); points.appendChild(g);
    const b=document.createElement('button'); b.textContent=loc.title; if(loc.id===selected)b.className='active'; b.onclick=()=>select(loc.id); legend.appendChild(b);
  });
  const loc=locations.find(x=>x.id===selected); document.getElementById('title').textContent=loc.title; document.getElementById('subtitle').textContent=loc.subtitle; document.getElementById('open').href=loc.href;
}
function select(id){selected=id;render()} render();
</script>
</body>
</html>
