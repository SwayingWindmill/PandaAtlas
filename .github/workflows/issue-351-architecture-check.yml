name: Issue 351 architecture check

on:
  push:
    branches:
      - feat/issue-351-acquisition-curation-routing

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check V2 architecture
        run: npm run check:architecture:v2
