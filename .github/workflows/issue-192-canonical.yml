name: Issue 192 Canonical OpenAPI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  register:
    if: github.head_ref == 'issue-192' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: issue-192
      - name: Register community curation paths
        shell: python
        run: |
          from pathlib import Path

          contract = Path("services/api/openapi/panda-atlas-v1.yaml")
          text = contract.read_text(encoding="utf-8-sig")
          tag = "  - name: admin-community-curation\n"
          if tag not in text:
              marker = "  - name: admin-accountable-publication\n"
              if marker not in text:
                  raise SystemExit("admin-accountable-publication tag marker missing")
              text = text.replace(marker, marker + tag, 1)

          paths = [
              "/api/v1/admin/community-curation/review-cases/{review_case_id}/bridge",
              "/api/v1/admin/community-curation/bridges/{bridge_id}",
              "/api/v1/admin/community-curation/releases/{release_id}/observed",
              "/api/v1/admin/community-curation/bridges/{bridge_id}/releases/{release_id}/projection-result",
              "/api/v1/admin/community-curation/bridge-metrics",
          ]
          first = "  /api/v1/admin/community-curation/review-cases/{review_case_id}/bridge:\n"
          if first not in text:
              block = []
              for path in paths:
                  pointer = path.replace("~", "~0").replace("/", "~1")
                  block.extend([
                      f"  {path}:\n",
                      f"    $ref: './community-curation-v1.yaml#/paths/{pointer}'\n",
                      "\n",
                  ])
              marker = "components:\n"
              if marker not in text:
                  raise SystemExit("components marker missing")
              text = text.replace(marker, "".join(block) + marker, 1)
          contract.write_text(text, encoding="utf-8")
      - name: Commit canonical registration and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-192-canonical.yml
          git add services/api/openapi/panda-atlas-v1.yaml
          git commit -m "docs(curation): register community bridge in canonical OpenAPI"
          git push origin HEAD:issue-192
