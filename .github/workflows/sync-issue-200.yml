name: Sync Issue 200 With Mainline

on:
  push:
    branches:
      - feat/issue-200-operational-readiness
    paths:
      - .github/workflows/sync-issue-200.yml

permissions:
  contents: write

jobs:
  sync-mainline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7.0.0
        with:
          ref: feat/issue-200-operational-readiness
          fetch-depth: 0

      - name: Merge current master without discarding readiness work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git merge --no-commit -X ours origin/master
          rm .github/workflows/sync-issue-200.yml
          git add -A
          git commit -m "merge: sync operational readiness with audit mainline"
          git push origin HEAD:feat/issue-200-operational-readiness
