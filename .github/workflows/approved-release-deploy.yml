name: Approved Release Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Managed database target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      version:
        description: Repository-approved Public Release version
        required: true
        default: "2026.07.31.1"
        type: string
      actor_account_id:
        description: Existing active Identity account with archive.accountable.publish
        required: true
        type: string
      execute:
        description: Apply the Archive Release instead of dry-run only
        required: false
        default: false
        type: boolean
      activate_public:
        description: Advance the Public Projection after exact record verification
        required: false
        default: false
        type: boolean
      allow_production:
        description: Explicitly authorize a production database write
        required: false
        default: false
        type: boolean
      confirmation:
        description: Exact confirmation shown in the runbook
        required: false
        default: ""
        type: string
      change_reference:
        description: Authorizing Issue, PR, or change record
        required: true
        default: "#278"
        type: string

permissions:
  contents: read

concurrency:
  group: approved-release-${{ inputs.environment }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.7"
  APPROVED_RELEASE_VERSION: "2026.07.31.1"

jobs:
  deploy:
    name: ${{ inputs.execute && 'Apply' || 'Preflight' }} approved release on ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}-release
    env:
      DATABASE_URL: ${{ inputs.environment == 'production' && secrets.PRODUCTION_DATABASE_URL || secrets.PREVIEW_DATABASE_URL }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      REQUESTED_VERSION: ${{ inputs.version }}
      ACTOR_ACCOUNT_ID: ${{ inputs.actor_account_id }}
      EXECUTE_REQUESTED: ${{ inputs.execute }}
      ACTIVATE_PUBLIC_REQUESTED: ${{ inputs.activate_public }}
      ALLOW_PRODUCTION_REQUESTED: ${{ inputs.allow_production }}
      CONFIRMATION: ${{ inputs.confirmation }}
      CHANGE_REFERENCE: ${{ inputs.change_reference }}
    steps:
      - name: Check out authoritative main
        uses: actions/checkout@v7.0.0
        with:
          ref: main
          clean: true

      - name: Validate bounded deployment request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Approved Release deployment must run from main."
            exit 1
          fi
          if [[ "$REQUESTED_VERSION" != "$APPROVED_RELEASE_VERSION" ]]; then
            echo "Only repository-approved release $APPROVED_RELEASE_VERSION is allowed."
            exit 1
          fi
          if [[ -z "$DATABASE_URL" ]]; then
            echo "The selected protected environment has no database URL."
            exit 1
          fi
          if [[ -z "$CHANGE_REFERENCE" ]]; then
            echo "A change reference is required."
            exit 1
          fi
          if [[ "$ACTIVATE_PUBLIC_REQUESTED" == "true" && "$EXECUTE_REQUESTED" != "true" ]]; then
            echo "Public activation requires execute=true."
            exit 1
          fi
          if [[ "$EXECUTE_REQUESTED" == "true" ]]; then
            expected="ACTIVATE $APPROVED_RELEASE_VERSION IN ${TARGET_ENVIRONMENT^^}"
            if [[ "$CONFIRMATION" != "$expected" ]]; then
              echo "Execution confirmation does not match the reviewed target."
              exit 1
            fi
          fi
          if [[ "$TARGET_ENVIRONMENT" == "production" && "$EXECUTE_REQUESTED" == "true" && "$ALLOW_PRODUCTION_REQUESTED" != "true" ]]; then
            echo "Production execution requires allow_production=true."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Run governed release command
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-gate
          args=(
            --version "$REQUESTED_VERSION"
            --actor-account-id "$ACTOR_ACCOUNT_ID"
            --environment "$TARGET_ENVIRONMENT"
            --reason "Approved Release deployment authorized by $CHANGE_REFERENCE."
          )
          if [[ "$EXECUTE_REQUESTED" == "true" ]]; then
            args+=(--apply)
          fi
          if [[ "$ACTIVATE_PUBLIC_REQUESTED" == "true" ]]; then
            args+=(--activate-public)
          fi
          if [[ "$TARGET_ENVIRONMENT" == "production" ]]; then
            args+=(--allow-production)
          fi
          uv run --directory services/api --frozen --extra dev \
            python scripts/bootstrap_approved_public_release.py "${args[@]}" \
            | tee .release-gate/approved-release-deployment.json

      - name: Upload immutable deployment evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: approved-release-${{ inputs.environment }}-${{ github.run_id }}
          path: .release-gate/approved-release-deployment.json
          if-no-files-found: error
