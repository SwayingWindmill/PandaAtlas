name: Crawler PoC

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
    paths:
      - ".github/workflows/crawler-poc.yml"
      - "data/acquisition-sources/**"
      - "docs/data-acquisition/**"
      - "tools/panda-data/src/panda_data/acquisition/**"
      - "tools/panda-data/src/panda_data/cli.py"
      - "tools/panda-data/tests/test_source_runtime.py"
      - "tools/panda-data/pyproject.toml"
      - "tools/panda-data/uv.lock"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.7"

jobs:
  crawler-poc:
    name: Controlled crawler PoC
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'delivery:map-close'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean repository
        uses: actions/checkout@v7.0.0
        with:
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Install pinned uv
        run: python -m pip install uv==${{ env.UV_VERSION }}

      - name: Install Chromium and runtime dependencies
        run: uv run --isolated --directory tools/panda-data --frozen --extra crawler playwright install --with-deps chromium

      - name: Install Scrapling browser runtimes
        run: uv run --isolated --directory tools/panda-data --frozen --extra crawler scrapling install

      - name: Run acquisition tests
        run: npm run test:crawler-poc

      - name: Run acquisition lint
        run: npm run lint:crawler-poc

      - name: Build offline Xi Lun source candidate
        run: npm run source:xi-lun

      - name: Run strict controlled browser and anti-detection lab
        run: npm run crawler:poc:strict

      - name: Verify PoC did not modify tracked files
        run: git diff --exit-code

      - name: Upload crawler comparison report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: crawler-poc
          path: .release-gate/
          if-no-files-found: error
          include-hidden-files: true
