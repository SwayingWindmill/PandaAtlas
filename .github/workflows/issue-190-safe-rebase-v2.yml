name: Issue 190 Safe Rebase V2

on:
  push:
    branches:
      - issue-190

permissions:
  contents: write

jobs:
  rebase:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: issue-190
          fetch-depth: 0
      - name: Execute audited resolver with conflict whitelist
        shell: python
        run: |
          from pathlib import Path

          source = Path('.github/workflows/issue-190-safe-rebase.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          if marker not in source:
              raise SystemExit('resolver script marker missing')
          block = source.split(marker, 1)[1]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines) + '\n'
          old = '''mapfile -t expected_sorted < <(printf '%s\\n' "${expected[@]}" | sort)
          if [[ "${conflicts[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'Unexpected conflict set:\\n%s\\n' "${conflicts[*]}"
            exit 1
          fi

          git checkout --theirs -- "${expected[@]}"'''
          new = '''for conflict in "${conflicts[@]}"; do
            allowed=false
            for expected_path in "${expected[@]}"; do
              if [[ "$conflict" == "$expected_path" ]]; then
                allowed=true
                break
              fi
            done
            if [[ "$allowed" != true ]]; then
              printf 'Unexpected conflict: %s\\n' "$conflict"
              exit 1
            fi
          done

          if (( ${#conflicts[@]} > 0 )); then
            git checkout --theirs -- "${conflicts[@]}"
          fi'''
          if old not in script:
              raise SystemExit('strict conflict block missing')
          Path('/tmp/issue-190-rebase.sh').write_text(script.replace(old, new, 1), encoding='utf-8')
      - name: Run safe rebase
        run: bash /tmp/issue-190-rebase.sh
