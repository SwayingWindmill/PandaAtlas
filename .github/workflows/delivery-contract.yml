name: Delivery Contract

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: delivery-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  validate:
    name: Issue-to-PR delivery contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request candidate
        uses: actions/checkout@v7.0.0
        with:
          clean: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate delivery metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release/check-delivery-contract.mjs
          --event "$GITHUB_EVENT_PATH"
          --github-api
