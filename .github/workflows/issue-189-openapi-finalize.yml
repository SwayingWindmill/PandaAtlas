name: Issue 189 OpenAPI Finalize

on:
  push:
    branches:
      - issue-189

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: issue-189
      - name: Insert canonical Review and Moderation references
        shell: python
        run: |
          from pathlib import Path

          contract = Path("services/api/openapi/panda-atlas-v1.yaml")
          text = contract.read_text(encoding="utf-8-sig")

          if "  - name: admin-review\n" not in text:
              marker = "  - name: admin\n"
              if marker not in text:
                  raise SystemExit("admin tag marker missing")
              text = text.replace(marker, marker + "  - name: admin-review\n", 1)

          review_paths = [
              "/api/v1/admin/review-cases",
              "/api/v1/admin/review-cases/intake/{submission_id}",
              "/api/v1/admin/review-cases/{review_case_id}",
              "/api/v1/admin/review-cases/{review_case_id}/active-revision",
              "/api/v1/admin/review-cases/{review_case_id}/triage",
              "/api/v1/admin/review-cases/{review_case_id}/claim",
              "/api/v1/admin/review-cases/{review_case_id}/request-information",
              "/api/v1/admin/review-cases/{review_case_id}/sources/{source_id}/verify",
              "/api/v1/admin/review-cases/{review_case_id}/decide",
              "/api/v1/admin/review-cases/{review_case_id}/recommend",
              "/api/v1/admin/review-cases/{review_case_id}/reopen",
              "/api/v1/admin/review-metrics",
          ]
          if "  /api/v1/admin/review-cases:\n" not in text:
              block = []
              for path in review_paths:
                  pointer = path.replace("~", "~0").replace("/", "~1")
                  block.extend([
                      f"  {path}:\n",
                      f"    $ref: './review-moderation-v1.yaml#/paths/{pointer}'\n",
                      "\n",
                  ])
              marker = "components:\n"
              if marker not in text:
                  raise SystemExit("components marker missing")
              text = text.replace(marker, "".join(block) + marker, 1)

          contract.write_text(text, encoding="utf-8")
      - name: Commit contract and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-189-openapi-finalize.yml
          git add services/api/openapi/panda-atlas-v1.yaml
          git commit -m "docs(review): register ReviewCase routes in canonical OpenAPI"
          git push origin HEAD:issue-189
