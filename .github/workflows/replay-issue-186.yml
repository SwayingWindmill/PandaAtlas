name: Replay Issue 186

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/replay-issue-186.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  replay:
    name: Replay #212 onto current master
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Replay issue 186 commit onto pre-workflow master
        run: |
          set -euxo pipefail
          BASE_SHA="${{ github.event.before }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="4884734acd2f943c8046d22a39d1f3e6801ec67a"
          fi
          git fetch origin master issue-186
          git checkout -B issue-186 "$BASE_SHA"
          git cherry-pick -X theirs ed48cb7783c6dbbdff6b8be0e898ea7646dc0596
          git status --short
          git push --force origin HEAD:issue-186

      - name: Remove temporary workflow from master
        if: always()
        run: |
          set -euxo pipefail
          git checkout master
          git pull --ff-only origin master
          git rm .github/workflows/replay-issue-186.yml
          git commit -m "ci: remove issue 186 replay workflow"
          git push origin master
