name: Development Verification

on:
  pull_request:
  # A merge result is verified as a whole: every scope, not just the scopes the pull request changed.
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.7"
  VERIFY_SELECTION: ${{ github.event_name == 'pull_request' && format('--base origin/{0}', github.base_ref) || '--all' }}

concurrency:
  group: development-verification-${{ github.ref }}
  # A newer pull request push supersedes the older one; every merge to main is verified to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan changed-scope verification
    runs-on: ubuntu-latest
    outputs:
      run_checks: ${{ steps.plan.outputs.run_checks }}
      scopes: ${{ steps.plan.outputs.scopes }}
      requires_node_modules: ${{ steps.plan.outputs.requires_node_modules }}
      requires_python: ${{ steps.plan.outputs.requires_python }}
      requires_uv: ${{ steps.plan.outputs.requires_uv }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7.0.0
        with:
          # Only a pull request diffs against its base.
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Resolve changed scopes
        id: plan
        run: node scripts/development/verify.mjs --list $VERIFY_SELECTION --github-output

  verify:
    name: Verify changed development scopes
    needs: plan
    if: needs.plan.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    steps:
      # Runs the scopes the plan selected, so only the plan job needs history.
      - name: Check out candidate
        uses: actions/checkout@v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        if: needs.plan.outputs.requires_python == 'true'
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned uv
        if: needs.plan.outputs.requires_uv == 'true'
        run: python -m pip install uv==${{ env.UV_VERSION }}

      - name: Install workspace dependencies
        if: needs.plan.outputs.requires_node_modules == 'true'
        run: npm ci

      - name: Run planned scope verification
        env:
          SCOPES: ${{ needs.plan.outputs.scopes }}
        run: |
          args=()
          for scope in ${SCOPES//,/ }; do args+=(--scope "$scope"); done
          npm run verify:dev -- "${args[@]}"

  api-integration:
    name: Run API integration against local Supabase
    needs: [plan, verify]
    if: needs.verify.result == 'success' && contains(needs.plan.outputs.scopes, 'api')
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Start pinned local Supabase foundation
        run: npm run infra:start

      - name: Verify generated Kysely database types
        run: npm run ops -- run api.db-types

      - name: Run real PostgreSQL integration suite
        run: npm run ops -- run api.integration

      - name: Verify committed IAM lifecycle evidence in disposable Supabase
        env:
          IAM06_COMMIT_EVIDENCE: "1"
        run: npm exec -w @zhipanda/api -- vitest run --config vitest.integration.config.ts test/integration/identity-http.integration.spec.ts -t "completes the invited reviewer lifecycle"

      - name: Stop local Supabase foundation
        if: always()
        run: npm run infra:stop
