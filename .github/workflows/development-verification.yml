name: Development Verification

on:
  pull_request:
    paths:
      - "services/api/**"
      - "packages/api-client/**"
      - "infra/supabase/**"
      - "scripts/development/**"
      - "scripts/release/check-repository-hygiene.mjs"
      - "scripts/release/tests/repository-hygiene.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/development-verification.yml"

permissions:
  contents: read

concurrency:
  group: development-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan changed-scope verification
    runs-on: ubuntu-latest
    outputs:
      run_checks: ${{ steps.plan.outputs.run_checks }}
      scopes: ${{ steps.plan.outputs.scopes }}
      requires_node_modules: ${{ steps.plan.outputs.requires_node_modules }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Resolve changed scopes
        id: plan
        run: node scripts/development/verify.mjs --list --base origin/${{ github.base_ref }} --github-output

  verify:
    name: Verify changed development scopes
    needs: plan
    if: needs.plan.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install workspace dependencies
        if: needs.plan.outputs.requires_node_modules == 'true'
        run: npm ci

      - name: Run changed-scope verification
        run: npm run verify:dev -- --base origin/${{ github.base_ref }}

  api-integration:
    name: Run API integration against local Supabase
    needs: [plan, verify]
    if: needs.verify.result == 'success' && contains(needs.plan.outputs.scopes, 'api')
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Start pinned local Supabase foundation
        run: npm run infra:start

      - name: Run real PostgreSQL integration suite
        run: npm run ops -- run api.integration

      - name: Stop local Supabase foundation
        if: always()
        run: npm run infra:stop
