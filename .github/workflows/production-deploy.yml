name: Production Deploy

# The only production release path (#504). A push to main that changes a deployable surface or a
# migration builds both Workers once, then waits for approval on the production Environment; after
# approval it applies pending migrations (#574), deploys the API before the Web Worker (the Web
# Worker's V2_API binding targets the API) and probes both.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "services/api/**"
      - "packages/api-client/**"
      - "infra/supabase/migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/production-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build Cloudflare artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build API and Web Workers
        run: npm run build:cloudflare

      - name: Boot the built API Worker in workerd
        run: npm run check:worker-boot -w @zhipanda/api

      - name: Boot the built Web Worker in workerd
        run: npm run check:worker-boot -w web

      - name: Keep the build output for the approved deploy
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cloudflare-build-output
          include-hidden-files: true
          # Approvals can wait up to 30 days; the output must outlive them.
          retention-days: 30
          path: |
            services/api/.cloudflare/output
            apps/web/.cloudflare/output

  deploy:
    name: Deploy API then Web
    needs: build
    # A manual dispatch from another ref may build, but only main deploys.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out main
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm

      # The job that receives secrets runs no dependency install scripts; cf and the Supabase CLI need none.
      - name: Install the pinned cf and Supabase CLIs
        run: npm ci --ignore-scripts

      - name: Restore the approved build output
        uses: actions/download-artifact@v8.0.2
        with:
          name: cloudflare-build-output

      # Migrations are expand-first, so the API still serving traffic keeps working on the new schema.
      - name: Apply pending database migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        # The installed CLI directly: npx/npm exec can echo their full command line, connection string included.
        run: ./node_modules/.bin/supabase db push --yes --db-url "$SUPABASE_DB_URL" --workdir infra

      - name: Deploy the API Worker
        working-directory: services/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx cf deploy --prebuilt --mode production --tag "${GITHUB_SHA::12}" --message "main@${GITHUB_SHA} run ${GITHUB_RUN_ID}"

      - name: Deploy the Web Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx cf deploy --prebuilt --mode production --tag "${GITHUB_SHA::12}" --message "main@${GITHUB_SHA} run ${GITHUB_RUN_ID}"

      - name: Probe the live custom domains
        run: |
          curl --fail --silent --show-error --max-time 20 --retry 3 --retry-all-errors https://api.zhipanda.com/health
          curl --fail --silent --show-error --max-time 20 --retry 3 --retry-all-errors https://api.zhipanda.com/ready
          curl --fail --silent --show-error --max-time 30 --retry 3 --retry-all-errors --output /dev/null "https://www.zhipanda.com/zh?deploy=${GITHUB_RUN_ID}"
