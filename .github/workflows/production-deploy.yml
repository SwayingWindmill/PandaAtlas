name: Production Deploy

# The only production release path (#504). A push to main that changes a deployable surface builds
# both Workers once, then waits for approval on the production Environment; after approval it deploys
# the API before the Web Worker (the Web Worker's V2_API binding targets the API) and probes both.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "services/api/**"
      - "packages/api-client/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/production-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build Cloudflare artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build API and Web Workers
        run: npm run build:cloudflare

      - name: Boot the built API Worker in workerd
        run: npm run check:worker-boot -w @zhipanda/api

      - name: Keep the build output for the approved deploy
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cloudflare-build-output
          include-hidden-files: true
          retention-days: 7
          path: |
            services/api/.cloudflare/output
            apps/web/.cloudflare/output

  deploy:
    name: Deploy API then Web
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out main
        uses: actions/checkout@v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install the pinned cf CLI
        run: npm ci

      - name: Restore the approved build output
        uses: actions/download-artifact@v8.0.2
        with:
          name: cloudflare-build-output

      - name: Deploy the API Worker
        working-directory: services/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx cf deploy --prebuilt --mode production --tag "${GITHUB_SHA::12}" --message "main@${GITHUB_SHA} run ${GITHUB_RUN_ID}"

      - name: Deploy the Web Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx cf deploy --prebuilt --mode production --tag "${GITHUB_SHA::12}" --message "main@${GITHUB_SHA} run ${GITHUB_RUN_ID}"

      - name: Probe the live custom domains
        run: |
          curl --fail --silent --show-error --max-time 20 --retry 3 --retry-all-errors https://api.zhipanda.com/health
          curl --fail --silent --show-error --max-time 20 --retry 3 --retry-all-errors https://api.zhipanda.com/ready
          curl --fail --silent --show-error --max-time 30 --retry 3 --retry-all-errors --output /dev/null "https://zhipanda.com/zh?deploy=${GITHUB_RUN_ID}"
