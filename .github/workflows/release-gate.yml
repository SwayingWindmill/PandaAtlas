name: Release Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
  workflow_dispatch:
    inputs:
      run_extended:
        description: Run the extended release gate (requires DATABASE_URL and ADMIN_API_TOKEN secrets)
        required: false
        default: false
        type: boolean

concurrency:
  group: release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  NPM_VERSION: "10.9.0"
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.7"

# The legacy tracked-file policy (`run: git diff --exit-code`) is implemented by
# scripts/release/check-workspace-cleanliness.mjs with consistent diagnostics.

jobs:
  development-gate:
    name: Development gate
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.draft == true ||
      !contains(github.event.pull_request.labels.*.name, 'delivery:map-close'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out development candidate
        uses: actions/checkout@v7.0.0
        with:
          clean: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Plan changed-scope development acceptance
        id: development-plan
        run: >-
          node scripts/release/development.mjs --list --github-output
          --base "${{ github.event.pull_request.base.sha }}"

      - name: Set up Python
        if: steps.development-plan.outputs.requires_python == 'true'
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned npm
        if: steps.development-plan.outputs.requires_node_modules == 'true'
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Install pinned uv
        if: steps.development-plan.outputs.requires_uv == 'true'
        run: python -m pip install uv==${{ env.UV_VERSION }}

      - name: Install workspace dependencies from lockfile
        if: steps.development-plan.outputs.requires_node_modules == 'true'
        run: npm ci

      - name: Run changed-scope development acceptance
        if: steps.development-plan.outputs.run_checks == 'true'
        run: npm run verify:dev -- --base "${{ github.event.pull_request.base.sha }}"

      - name: Verify development checks did not modify tracked files
        if: steps.development-plan.outputs.run_checks == 'true'
        run: node scripts/release/check-workspace-cleanliness.mjs --context development-gate

  release-gate:
    name: Authoritative map-close gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'delivery:map-close'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean repository
        uses: actions/checkout@v7.0.0
        with:
          clean: true

      - name: Set up release candidate toolchain
        uses: ./.github/actions/setup-release-candidate
        with:
          node-version: ${{ env.NODE_VERSION }}
          npm-version: ${{ env.NPM_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          show-versions: "true"

      - name: Install browser matrix and runtime dependencies
        working-directory: apps/web
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run authoritative map-close release gate
        env:
          PLAYWRIGHT_BROWSER_MATRIX: "1"
          RELEASE_GATE_USE_SYSTEM_EDGE: "0"
        run: npm run release:map-close

      - name: Verify gate did not modify tracked files
        run: node scripts/release/check-workspace-cleanliness.mjs --context authoritative-map-close

      - name: Upload release report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-gate-map-close
          path: .release-gate/
          if-no-files-found: error
          include-hidden-files: true

  release-gate-windows:
    name: Windows map-close compatibility
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'delivery:map-close'))
    runs-on: windows-latest
    steps:
      - name: Check out clean repository
        uses: actions/checkout@v7.0.0
        with:
          clean: true

      - name: Set up release candidate toolchain
        uses: ./.github/actions/setup-release-candidate
        with:
          node-version: ${{ env.NODE_VERSION }}
          npm-version: ${{ env.NPM_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}

      - name: Install fixed Chromium runtime
        working-directory: apps/web
        run: npx playwright install chromium

      - name: Run Windows map-close compatibility gate
        env:
          RELEASE_GATE_USE_SYSTEM_EDGE: "0"
        run: npm run release:map-close:windows

      - name: Verify gate did not modify tracked files
        run: node scripts/release/check-workspace-cleanliness.mjs --context windows-map-close

      - name: Upload Windows release report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-gate-map-close-windows
          path: .release-gate/
          if-no-files-found: error
          include-hidden-files: true

  supabase-foundation:
    name: Supabase reset and published-return recovery
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'delivery:map-close'))
    needs: [release-gate, release-gate-windows]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:54322/postgres
      REAL_DB_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:54322/postgres
      RUN_REAL_DB_TESTS: "1"
      RUN_NOTIFICATION_STAGING: "1"
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
      AUTH_SMTP_HOST: ${{ secrets.AUTH_SMTP_HOST }}
      AUTH_SMTP_PORT: ${{ secrets.AUTH_SMTP_PORT }}
      AUTH_SMTP_USERNAME: ${{ secrets.AUTH_SMTP_USERNAME }}
      AUTH_SMTP_PASSWORD: ${{ secrets.AUTH_SMTP_PASSWORD }}
      AUTH_SMTP_FROM_EMAIL: ${{ secrets.AUTH_SMTP_FROM_EMAIL }}
      NOTIFICATION_STAGING_TO_EMAIL: ${{ secrets.NOTIFICATION_STAGING_TO_EMAIL }}
    steps:
      - name: Check out clean repository
        uses: actions/checkout@v7.0.0
        with:
          clean: true

      - name: Set up release candidate toolchain
        uses: ./.github/actions/setup-release-candidate
        with:
          node-version: ${{ env.NODE_VERSION }}
          npm-version: ${{ env.NPM_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}

      - name: Start pinned Supabase foundation
        run: npm run infra:start

      - name: Reset migrations and seed data
        run: npm run infra:reset

      - name: Verify PostGIS, PGMQ, storage, and migration foundation
        run: npm run infra:preflight

      - name: Prepare immutable foundation evidence directory
        run: mkdir -p .release-gate

      - name: Run real PostgreSQL engagement tests
        working-directory: services/api
        run: >-
          uv run --isolated --frozen --extra dev pytest -q
          tests/integration/test_engagement_real_db.py
          --junitxml=../../.release-gate/engagement-real-db.xml

      - name: Run published Activity projection and rebuild tests
        working-directory: services/api
        run: >-
          uv run --isolated --frozen --extra dev pytest -q
          tests/integration/test_activity_projection_real_db.py
          --junitxml=../../.release-gate/activity-real-db.xml

      - name: Run personalized Feed cursor and Follow-scope tests
        working-directory: services/api
        run: >-
          uv run --isolated --frozen --extra dev pytest -q
          tests/integration/test_feed_real_db.py
          --junitxml=../../.release-gate/feed-real-db.xml

      - name: Run native Inbox, PGMQ, webhook, retry, and DLQ tests
        working-directory: services/api
        run: >-
          uv run --isolated --frozen --extra dev pytest -q
          tests/integration/test_notification_real_db.py
          --junitxml=../../.release-gate/notification-real-db.xml

      - name: Run scoped moderation sanctions and appeals journey
        working-directory: services/api
        run: >-
          uv run --isolated --frozen --extra dev pytest -q
          tests/integration/test_moderation_appeals_real_db.py
          --junitxml=../../.release-gate/moderation-appeals-real-db.xml

      - name: Run accountable Archive governance and recovery journey
        working-directory: services/api
        run: >-
          uv run --isolated --frozen --extra dev pytest -q
          tests/integration/test_accountable_archive_governance_real_db.py
          --junitxml=../../.release-gate/archive-governance-real-db.xml

      - name: Record deterministic Archive governance rehearsal evidence
        working-directory: services/api
        env:
          ARCHIVE_SINGLE_ACCOUNTABLE_APPROVER_ENABLED: "true"
        run: >-
          uv run --isolated --frozen --extra dev python
          scripts/rehearse_archive_governance_cutover.py
          --output ../../.release-gate/archive-governance-rehearsal.json
          --require-go

      - name: Run identity deletion, retry, and restore drill
        run: npm run drill:identity-engagement-recovery

      - name: Record Resend and Auth SMTP staging evidence
        continue-on-error: true
        run: npm run drill:notification-staging

      - name: Seal published-return foundation evidence
        if: always()
        run: node scripts/release/seal-published-return-evidence.mjs

      - name: Stop Supabase foundation
        if: always()
        run: npm run infra:stop

      - name: Upload foundation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: supabase-foundation
          path: .release-gate/
          if-no-files-found: error
          include-hidden-files: true

  release-gate-extended:
    name: Extended gate
    if: github.event_name == 'workflow_dispatch' && inputs.run_extended
    needs: release-gate
    runs-on: ubuntu-latest
    env:
      RUN_REAL_DB_TESTS: "1"
      RUN_ADMIN_IMPORT_SMOKE: "1"
      RUN_POSTGRES_ATTACHMENT_RECOVERY: "1"
      RUN_IDENTITY_ENGAGEMENT_RECOVERY: "1"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
    steps:
      - name: Check out clean repository
        uses: actions/checkout@v7.0.0
        with:
          clean: true

      - name: Set up release candidate toolchain
        uses: ./.github/actions/setup-release-candidate
        with:
          node-version: ${{ env.NODE_VERSION }}
          npm-version: ${{ env.NPM_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}

      - name: Install browser matrix and runtime dependencies
        working-directory: apps/web
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run extended release gate
        env:
          PLAYWRIGHT_BROWSER_MATRIX: "1"
          RELEASE_GATE_USE_SYSTEM_EDGE: "0"
        run: npm run release:extended

      - name: Verify gate did not modify tracked files
        run: node scripts/release/check-workspace-cleanliness.mjs --context extended-gate

      - name: Upload extended release report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-gate-extended
          path: .release-gate/
          if-no-files-found: error
          include-hidden-files: true
