name: Issue 191 Ruff Fix

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'issue-191' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: issue-191
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install uv==0.11.7
      - name: Apply Ruff safe fixes
        run: uv run --directory services/api --frozen --extra dev ruff check --fix app tests scripts
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-191-ruff-fix.yml
          git add services/api/app services/api/tests services/api/scripts
          git commit -m "fix(api): apply accountable publication Ruff fixes"
          git push origin HEAD:issue-191
