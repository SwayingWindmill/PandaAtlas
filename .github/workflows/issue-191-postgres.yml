name: Issue 191 PostgreSQL Verification

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'issue-191' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: issue-191
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12'
      - name: Preserve compatibility-view column order
        shell: python
        run: |
          from pathlib import Path

          path = Path(
              "infra/supabase/migrations/"
              "0020_accountable_archive_publication.sql"
          )
          text = path.read_text(encoding="utf-8")
          start = text.index(
              "create or replace view public.change_set_governance_compatibility as\n"
          )
          end_marker = "from public.change_sets change_set;\n"
          end = text.index(end_marker, start) + len(end_marker)
          replacement = """create or replace view public.change_set_governance_compatibility as
          select
            change_set.id,
            change_set.status as stored_status,
            change_set.governance_mode,
            change_set.validation_state,
            change_set.created_by,
            change_set.reviewed_by as legacy_reviewed_by,
            change_set.reviewed_at as legacy_reviewed_at,
            change_set.review_reason as legacy_review_reason,
            change_set.validated_by,
            change_set.validated_at,
            change_set.validation_reason,
            change_set.base_archive_version,
            change_set.governance_version,
            case
              when change_set.status = 'approved' then 'legacy_approved'
              when change_set.status = 'published' then 'published'
              when change_set.validation_state = 'ready' then 'ready'
              when change_set.validation_state = 'validation_failed' then 'validation_failed'
              else change_set.status
            end as effective_state,
            (
              change_set.governance_mode = 'four-eyes-v1'
              and change_set.status in ('submitted', 'approved')
            ) as requires_explicit_revalidation,
            (
              change_set.governance_mode = 'four-eyes-v1'
              and change_set.status = 'approved'
            ) as legacy_publication_eligible,
            change_set.risk_level,
            change_set.origin_context,
            change_set.origin_actor_id,
            change_set.published_release_id,
            (
              change_set.governance_mode = 'single-accountable-approver-v1'
              and change_set.status = 'ready'
              and change_set.validation_state = 'ready'
            ) as accountable_publication_eligible
          from public.change_sets change_set;
          """
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
      - name: Install pinned toolchain
        run: |
          npm install --global npm@10.9.0
          python -m pip install uv==0.11.7
          npm ci
      - name: Start and reset pinned Supabase foundation
        run: |
          npm run infra:start
          npm run infra:reset
      - name: Run Foundation preflight through migration 0020
        run: npm run infra:preflight
      - name: Stop foundation
        if: always()
        run: npm run infra:stop
      - name: Commit verified migration and remove one-time workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-191-postgres.yml
          git add infra/supabase/migrations/0020_accountable_archive_publication.sql
          git commit -m "fix(archive): preserve governance compatibility view"
          git push origin HEAD:issue-191
