name: Issue 191 Canonical OpenAPI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  register:
    if: github.head_ref == 'issue-191' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: issue-191
      - name: Apply deterministic lint fixes and canonical contract registration
        shell: python
        run: |
          from pathlib import Path

          service_path = Path("services/api/app/archive_publication/service.py")
          service = service_path.read_text(encoding="utf-8")
          service = service.replace(
              "from typing import Any, Iterator\n",
              "from collections.abc import Iterator\nfrom typing import Any\n",
              1,
          )
          service = service.replace(
              '        issues=[ArchiveValidationIssueRead.model_validate(item) for item in _json_array(row["issues"])],\n',
              '        issues=[\n'
              '            ArchiveValidationIssueRead.model_validate(item)\n'
              '            for item in _json_array(row["issues"])\n'
              '        ],\n',
              1,
          )
          service_path.write_text(service, encoding="utf-8")

          storage_path = Path(
              "services/api/tests/contracts/"
              "test_accountable_publication_storage_contract.py"
          )
          storage = storage_path.read_text(encoding="utf-8")
          storage = storage.replace(
              '    function_body = sql.split("create or replace function public.publish_accountable_change_set", 1)[1]\n',
              '    function_body = sql.split(\n'
              '        "create or replace function public.publish_accountable_change_set", 1\n'
              '    )[1]\n',
          )
          storage = storage.replace(
              '    assert "sensitive publication requires senior capability and recent authentication" in function_body\n',
              '    assert (\n'
              '        "sensitive publication requires senior capability and recent authentication"\n'
              '        in function_body\n'
              '    )\n',
              1,
          )
          storage_path.write_text(storage, encoding="utf-8")

          foundation_path = Path(
              "services/api/tests/scripts/test_check_zhipanda_foundation.py"
          )
          foundation = foundation_path.read_text(encoding="utf-8")
          foundation = foundation.replace("    run_foundation_preflight,\n", "", 1)
          foundation_path.write_text(foundation, encoding="utf-8")

          contract = Path("services/api/openapi/panda-atlas-v1.yaml")
          text = contract.read_text(encoding="utf-8-sig")
          if "  - name: admin-accountable-publication\n" not in text:
              marker = "  - name: admin\n"
              if marker not in text:
                  raise SystemExit("admin tag marker missing")
              text = text.replace(
                  marker,
                  marker + "  - name: admin-accountable-publication\n",
                  1,
              )
          paths = [
              "/api/v1/admin/archive/change-sets/{change_set_id}/validate",
              "/api/v1/admin/archive/change-sets/{change_set_id}/publish",
              "/api/v1/admin/archive/publication-metrics",
          ]
          if "  /api/v1/admin/archive/change-sets/{change_set_id}/validate:\n" not in text:
              block = []
              for path in paths:
                  pointer = path.replace("~", "~0").replace("/", "~1")
                  block.extend([
                      f"  {path}:\n",
                      f"    $ref: './accountable-publication-v1.yaml#/paths/{pointer}'\n",
                      "\n",
                  ])
              marker = "components:\n"
              if marker not in text:
                  raise SystemExit("components marker missing")
              text = text.replace(marker, "".join(block) + marker, 1)
          contract.write_text(text, encoding="utf-8")
      - name: Commit fixes, canonical registration, and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-191-context.yml
          git add services/api/app/archive_publication/service.py
          git add services/api/tests/contracts/test_accountable_publication_storage_contract.py
          git add services/api/tests/scripts/test_check_zhipanda_foundation.py
          git add services/api/openapi/panda-atlas-v1.yaml
          git commit -m "fix(archive): align accountable publication contracts"
          git push origin HEAD:issue-191
