name: Issue 351 branch check

on:
  push:
    branches:
      - feat/issue-351-acquisition-curation-routing

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-351-acquisition-curation-routing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Regenerate API contracts
        run: |
          npm run openapi:generate -w @zhipanda/api
          npm run generate -w @zhipanda/api-client
      - name: Typecheck V2
        run: npm run typecheck:v2
      - name: Lint API
        run: npm run lint:v2
      - name: Start fresh local Supabase
        run: npm run infra:start
      - name: Apply migrations and seeds through 0049
        run: npm run infra:reset
      - name: Run acquisition Curation owner-routing journey
        run: npm run test:integration -w @zhipanda/api -- test/integration/acquisition-curation.integration.spec.ts
      - name: Stop local Supabase
        if: always()
        run: npm run infra:stop
      - name: Commit generated contracts when changed
        shell: bash
        run: |
          if git diff --quiet -- services/api/openapi/panda-atlas-v2.json packages/api-client/src/schema.generated.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/openapi/panda-atlas-v2.json packages/api-client/src/schema.generated.ts
          git commit -m "chore(api): regenerate V2 contracts for issue 351"
          git pull --rebase origin feat/issue-351-acquisition-curation-routing
          git push origin HEAD:feat/issue-351-acquisition-curation-routing
