name: Approved Release Bootstrap Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - ".github/workflows/approved-release-bootstrap.yml"
      - "scripts/release/patch_moderation_audit_fixture.py"

permissions:
  contents: write

concurrency:
  group: approved-release-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approved-release-bootstrap:
    name: Repair moderation recovery fixture
    runs-on: ubuntu-latest
    steps:
      - name: Check out operational branch
        uses: actions/checkout@v7.0.0
        with:
          ref: feat/issue-200-operational-readiness
          fetch-depth: 0

      - name: Patch Audit-aware cleanup
        run: python scripts/release/patch_moderation_audit_fixture.py

      - name: Commit fixture repair
        shell: bash
        run: |
          git show HEAD^:.github/workflows/approved-release-bootstrap.yml > .github/workflows/approved-release-bootstrap.yml
          rm scripts/release/patch_moderation_audit_fixture.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(moderation): clear unified audit fixture state"
          git push origin HEAD:feat/issue-200-operational-readiness
