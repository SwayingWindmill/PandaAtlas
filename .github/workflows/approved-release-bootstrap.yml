name: Approved Release Bootstrap Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - ".github/workflows/approved-release-bootstrap.yml"
      - "data/public-releases/**"
      - "data/reviewed-batches/**"
      - "infra/supabase/migrations/**"
      - "services/api/app/projection/approved_release_bootstrap.py"
      - "services/api/app/services/release_service.py"
      - "services/api/scripts/bootstrap_approved_public_release.py"
      - "services/api/scripts/check_seedless_release_foundation.py"
      - "services/api/scripts/run_privacy_tombstone_recovery_drill.py"
      - "services/api/scripts/run_audit_integrity_recovery_drill.py"
      - "services/api/tests/integration/test_approved_release_bootstrap_real_db.py"
      - "services/api/tests/integration/test_privacy_operations_real_db.py"
      - "services/api/tests/integration/test_unified_audit_real_db.py"
      - "services/api/tests/projection/test_approved_release_bootstrap.py"

permissions:
  contents: write

concurrency:
  group: approved-release-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NPM_VERSION: "10.9.0"
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.7"
  DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:54322/postgres
  REAL_DB_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:54322/postgres
  RUN_REAL_DB_TESTS: "1"

jobs:
  approved-release-bootstrap:
    name: Approved release real PostgreSQL journey
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean candidate
        uses: actions/checkout@v7.0.0
        with:
          clean: true
          fetch-depth: 0

      - name: Apply Issue 200 feature drills
        run: python scripts/release/apply_issue_200_feature_drills.py

      - name: Commit integrated feature drills
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/approved-release-bootstrap.yml')
          content = path.read_text(encoding='utf-8')
          content = content.replace('permissions:\n  contents: write\n\n', '', 1)
          start = content.index('      - name: Apply Issue 200 feature drills\n')
          end = content.index('      - name: Set up release candidate toolchain\n')
          path.write_text(content[:start] + content[end:], encoding='utf-8')
          PY
          rm .github/workflows/apply-issue-200-feature-drills.yml
          rm scripts/release/apply_issue_200_feature_drills.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(release): bind real feature recovery drills"
          git push origin HEAD:feat/issue-200-operational-readiness

      - name: Set up release candidate toolchain
        uses: ./.github/actions/setup-release-candidate
        with:
          node-version: ${{ env.NODE_VERSION }}
          npm-version: ${{ env.NPM_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          show-versions: "true"

      - name: Start pinned Supabase foundation
        run: npm run infra:start

      - name: Reset migrations without demo seed
        run: >-
          npx --yes supabase@2.110.0 db reset
          --workdir infra
          --no-seed

      - name: Verify seedless release foundation
        working-directory: services/api
        run: >-
          uv run --isolated --frozen --extra dev python
          scripts/check_seedless_release_foundation.py

      - name: Run approved release bootstrap journey
        working-directory: services/api
        run: >-
          uv run --isolated --frozen --extra dev pytest -q
          tests/integration/test_approved_release_bootstrap_real_db.py
          --junitxml=../../approved-release-bootstrap-real-db.xml

      - name: Run privacy tombstone recovery drill
        working-directory: services/api
        run: >-
          uv run --isolated --frozen --extra dev python
          scripts/run_privacy_tombstone_recovery_drill.py

      - name: Run audit integrity recovery drill
        working-directory: services/api
        run: >-
          uv run --isolated --frozen --extra dev python
          scripts/run_audit_integrity_recovery_drill.py

      - name: Upload database acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: approved-release-bootstrap-real-db
          path: |
            approved-release-bootstrap-real-db.xml
            .release-gate/privacy-tombstone-recovery.json
            .release-gate/audit-integrity-recovery.json
          if-no-files-found: warn

      - name: Stop Supabase foundation
        if: always()
        run: npm run infra:stop
