name: Issue 191 Implement

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'issue-191' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: issue-191
          fetch-depth: 0
      - name: Write accountable publication slice
        shell: python
        env:
          FILE_PAYLOAD: '{"services/api/app/archive_publication/__init__.py":"IiIiU2luZ2xlLWFjY291bnRhYmxlLWFwcHJvdmVyIEFyY2hpdmUgcHVibGljYXRpb24gYm91bmRhcnkuIiIiCg==","services/api/app/archive_publication/models.py":"","services/api/app/archive_publication/service.py":"","services/api/app/api/v1/admin_accountable_publications.py":"","infra/supabase/migrations/0020_accountable_archive_publication.sql":"YmVnaW47Cgo...","docs/architecture/accountable-archive-publication.md":"IyBBY2NvdW50YWJsZSBBcmNoaXZlIFB1YmxpY2F0aW9uCg...","services/api/openapi/accountable-publication-v1.yaml":"b3BlbmFwaTogMy4xLjAK...","services/api/tests/archive_publication/test_accountable_publication_models.py":"ZnJvbSB1dWlkIGltcG9ydCBVVUlECg...","services/api/tests/contracts/test_accountable_publication_storage_contract.py":"ZnJvbSBwYXRobGliIGltcG9ydCBQYXRoCg...","services/api/tests/contracts/test_accountable_publication_openapi_contract.py":"ZnJvbSBwYXRobGliIGltcG9ydCBQYXRoCg..."}'
        run: |
          import base64
          import json
          from pathlib import Path

          files = json.loads(__import__("os").environ["FILE_PAYLOAD"])
          for path, encoded in files.items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded))

          router_path = Path("services/api/app/api/router.py")
          router = router_path.read_text(encoding="utf-8")
          if "admin_accountable_publications," not in router:
              router = router.replace(
                  "from app.api.v1 import (\n",
                  "from app.api.v1 import (\n    admin_accountable_publications,\n",
                  1,
              )
          include_line = (
              'api_router.include_router('
              'admin_accountable_publications.router, '
              'tags=["admin-accountable-publication"]'
              ')\n'
          )
          if include_line not in router:
              marker = (
                  'api_router.include_router('
                  'admin_publications.router, tags=["admin-publication"]'
                  ')\n'
              )
              router = router.replace(marker, include_line + marker, 1)
          router_path.write_text(router, encoding="utf-8")

          foundation_path = Path(
              "services/api/tests/scripts/test_check_zhipanda_foundation.py"
          )
          foundation = foundation_path.read_text(encoding="utf-8")
          foundation = foundation.replace(
              'assert evidence["migration_versions"][-1] == "0019"',
              'assert evidence["migration_versions"][-1] == "0020"',
              1,
          )
          if '        "0020",\n' not in foundation:
              foundation = foundation.replace(
                  '        "0019",\n    ]\n',
                  '        "0019",\n        "0020",\n    ]\n',
                  1,
              )
          foundation_path.write_text(foundation, encoding="utf-8")

          canonical_path = Path("services/api/openapi/panda-atlas-v1.yaml")
          canonical = canonical_path.read_text(encoding="utf-8-sig")
          if "  - name: admin-accountable-publication\n" not in canonical:
              marker = "  - name: admin\n"
              canonical = canonical.replace(
                  marker,
                  marker + "  - name: admin-accountable-publication\n",
                  1,
              )
          accountable_paths = [
              "/api/v1/admin/archive/change-sets/{change_set_id}/validate",
              "/api/v1/admin/archive/change-sets/{change_set_id}/publish",
              "/api/v1/admin/archive/publication-metrics",
          ]
          if "  /api/v1/admin/archive/change-sets/{change_set_id}/validate:\n" not in canonical:
              block = []
              for path in accountable_paths:
                  pointer = path.replace("~", "~0").replace("/", "~1")
                  block.extend(
                      [
                          f"  {path}:\n",
                          (
                              "    $ref: "
                              f"'./accountable-publication-v1.yaml#/paths/{pointer}'\n"
                          ),
                          "\n",
                      ]
                  )
              canonical = canonical.replace(
                  "components:\n",
                  "".join(block) + "components:\n",
                  1,
              )
          canonical_path.write_text(canonical, encoding="utf-8")

          for temporary in (
              Path(".github/workflows/issue-191-context.yml"),
              Path(".github/workflows/issue-191-implement.yml"),
          ):
              if temporary.exists():
                  temporary.unlink()
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(archive): implement accountable validation and publish"
          git push origin HEAD:issue-191
