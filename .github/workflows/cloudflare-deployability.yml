name: Cloudflare Deployability

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "services/api/**"
      - "packages/api-client/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-deployability.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deployability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Cloudflare artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build current Cloudflare Web and API artifacts
        run: npm run build:cloudflare
