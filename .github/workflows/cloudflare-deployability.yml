name: Cloudflare Deployability

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "services/api/**"
      - "packages/api-client/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-deployability.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "services/api/**"
      - "packages/api-client/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-deployability.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deployability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Cloudflare artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run current Web browser acceptance
        env:
          RELEASE_GATE_USE_SYSTEM_EDGE: "0"
        run: |
          npm run smoke:web
          npm run test:admin-shell -w web

      - name: Build current Cloudflare Web and API artifacts
        run: npm run build:cloudflare

      - name: Boot the built API Worker in workerd
        run: npm run check:worker-boot -w @zhipanda/api
