name: Issue 194 canonical OpenAPI sync

on:
  push:
    branches:
      - issue-194
    paths:
      - .github/workflows/issue-194-openapi-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v7.0.0
        with:
          ref: issue-194
          fetch-depth: 0

      - name: Apply canonical OpenAPI references
        run: |
          git apply --check scripts/openapi/issue-194-canonical.patch
          git apply scripts/openapi/issue-194-canonical.patch
          git rm scripts/openapi/issue-194-canonical.patch
          git rm .github/workflows/issue-194-openapi-sync.yml

      - name: Commit canonical contract update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/openapi/panda-atlas-v1.yaml
          git commit -m "docs(api): register accountable archive operations"
          git push origin HEAD:issue-194
