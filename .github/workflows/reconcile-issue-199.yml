name: Reconcile Issue 199 Mainline

on:
  push:
    branches:
      - feat/issue-199-unified-audit
    paths:
      - .github/workflows/reconcile-issue-199.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Audit branch
        uses: actions/checkout@v7.0.0
        with:
          ref: feat/issue-199-unified-audit
          fetch-depth: 0

      - name: Preserve Moderation, Privacy, and Audit controls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding="utf-8")
              if content.count(old) != 1:
                  raise SystemExit(f"expected one replacement in {path}: {old[:80]!r}")
              target.write_text(content.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "services/api/app/core/config.py",
              '''    review_moderation_enabled: bool = Field(default=False, alias="REVIEW_MODERATION_ENABLED")
              unified_audit_enabled: bool = Field(default=False, alias="UNIFIED_AUDIT_ENABLED")
          ''',
              '''    review_moderation_enabled: bool = Field(default=False, alias="REVIEW_MODERATION_ENABLED")
              moderation_controls_enabled: bool = Field(default=False, alias="MODERATION_CONTROLS_ENABLED")
              moderation_repeat_abuse_alert_count: int = Field(
                  default=3,
                  ge=1,
                  alias="MODERATION_REPEAT_ABUSE_ALERT_COUNT",
              )
              moderation_sanction_age_alert_seconds: int = Field(
                  default=2592000,
                  ge=3600,
                  alias="MODERATION_SANCTION_AGE_ALERT_SECONDS",
              )
              moderation_appeal_age_alert_seconds: int = Field(
                  default=432000,
                  ge=3600,
                  alias="MODERATION_APPEAL_AGE_ALERT_SECONDS",
              )
              privacy_operations_enabled: bool = Field(default=False, alias="PRIVACY_OPERATIONS_ENABLED")
              privacy_export_master_key: str = Field(
                  default="local-privacy-export-master-key-change-me",
                  min_length=32,
                  alias="PRIVACY_EXPORT_MASTER_KEY",
              )
              privacy_export_download_signing_key: str = Field(
                  default="local-privacy-export-download-signing-key-change-me",
                  min_length=32,
                  alias="PRIVACY_EXPORT_DOWNLOAD_SIGNING_KEY",
              )
              privacy_export_artifact_ttl_seconds: int = Field(
                  default=86400,
                  ge=300,
                  le=86400,
                  alias="PRIVACY_EXPORT_ARTIFACT_TTL_SECONDS",
              )
              privacy_export_download_ttl_seconds: int = Field(
                  default=300,
                  ge=30,
                  le=900,
                  alias="PRIVACY_EXPORT_DOWNLOAD_TTL_SECONDS",
              )
              unified_audit_enabled: bool = Field(default=False, alias="UNIFIED_AUDIT_ENABLED")
          ''',
          )
          replace_once(
              "services/api/app/core/config.py",
              '''        if (
                  self.unified_audit_enabled
          ''',
              '''        if self.privacy_export_download_ttl_seconds > self.privacy_export_artifact_ttl_seconds:
                  raise ValueError("Privacy export download TTL cannot exceed artifact TTL")
              if self.privacy_operations_enabled:
                  if self.privacy_export_master_key == self.privacy_export_download_signing_key:
                      raise ValueError("Privacy export encryption and signing keys must differ")
                  if env not in {"development", "dev", "local", "test"}:
                      if (
                          self.privacy_export_master_key
                          == "local-privacy-export-master-key-change-me"
                      ):
                          raise ValueError("PRIVACY_EXPORT_MASTER_KEY must be configured")
                      if (
                          self.privacy_export_download_signing_key
                          == "local-privacy-export-download-signing-key-change-me"
                      ):
                          raise ValueError("PRIVACY_EXPORT_DOWNLOAD_SIGNING_KEY must be configured")
              if (
                  self.unified_audit_enabled
          ''',
          )
          replace_once(
              "apps/web/components/admin/react-admin-shell.tsx",
              '''import { AuditWorkbench } from "@/components/admin/audit-workbench";
          import { ReviewCaseWorkbench } from "@/components/admin/review-case-workbench";
          ''',
              '''import { AuditWorkbench } from "@/components/admin/audit-workbench";
          import { ModerationWorkbench } from "@/components/admin/moderation-workbench";
          import { PrivacyWorkbench } from "@/components/admin/privacy-workbench";
          import { ReviewCaseWorkbench } from "@/components/admin/review-case-workbench";
          ''',
          )
          replace_once(
              ".github/workflows/approved-release-bootstrap.yml",
              '''      - "services/api/scripts/run_privacy_tombstone_recovery_drill.py"
          ''',
              '''      - "services/api/scripts/run_privacy_tombstone_recovery_drill.py"
                - "services/api/scripts/run_audit_integrity_recovery_drill.py"
          ''',
          )
          replace_once(
              ".github/workflows/approved-release-bootstrap.yml",
              '''      - "services/api/tests/integration/test_privacy_operations_real_db.py"
          ''',
              '''      - "services/api/tests/integration/test_privacy_operations_real_db.py"
                - "services/api/tests/integration/test_unified_audit_real_db.py"
          ''',
          )
          replace_once(
              ".github/workflows/approved-release-bootstrap.yml",
              '''      - name: Upload database acceptance evidence
          ''',
              '''      - name: Run audit integrity recovery drill
                  working-directory: services/api
                  run: >-
                    uv run --isolated --frozen --extra dev python
                    scripts/run_audit_integrity_recovery_drill.py

                - name: Upload database acceptance evidence
          ''',
          )
          replace_once(
              ".github/workflows/approved-release-bootstrap.yml",
              '''            .release-gate/privacy-tombstone-recovery.json
          ''',
              '''            .release-gate/privacy-tombstone-recovery.json
                    .release-gate/audit-integrity-recovery.json
          ''',
          )
          Path("services/api/tests/scripts/test_check_seedless_release_foundation.py").write_text(
              '''from pathlib import Path

          from scripts.check_seedless_release_foundation import expected_migrations


          def test_expected_migrations_supports_non_contiguous_versions(tmp_path: Path) -> None:
              (tmp_path / "0001_initial.sql").write_text("select 1;\\n", encoding="utf-8")
              (tmp_path / "0026_moderation.sql").write_text("select 1;\\n", encoding="utf-8")
              (tmp_path / "0031_audit.sql").write_text("select 1;\\n", encoding="utf-8")

              assert expected_migrations(tmp_path) == ("0001", "0026", "0031")


          def test_expected_migrations_ignores_non_sql_and_invalid_names(tmp_path: Path) -> None:
              (tmp_path / "0001_initial.sql").write_text("select 1;\\n", encoding="utf-8")
              (tmp_path / "0002_notes.txt").write_text("not a migration\\n", encoding="utf-8")
              (tmp_path / "README.sql").write_text("not a migration\\n", encoding="utf-8")
              (tmp_path / "draft.sql").write_text("not a migration\\n", encoding="utf-8")

              assert expected_migrations(tmp_path) == ("0001",)
          ''',
              encoding="utf-8",
          )
          replace_once(
              "services/api/tests/scripts/test_check_zhipanda_foundation.py",
              '''    assert "activity" not in evidence["api_schemas"]
          ''',
              '''    assert "activity" not in evidence["api_schemas"]
              assert "audit" not in evidence["api_schemas"]
          ''',
          )
          replace_once(
              "services/api/tests/scripts/test_check_zhipanda_foundation.py",
              '''        "0025",
                "0031",
          ''',
              '''        "0025",
                "0026",
                "0027",
                "0028",
                "0029",
                "0030",
                "0031",
          ''',
          )
          replace_once(
              "services/api/tests/scripts/test_build_serverless_closure.py",
              'assert payload["summary"]["module_count"] == 93',
              'assert payload["summary"]["module_count"] == 103',
          )
          PY
          rm .github/workflows/reconcile-issue-199.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(audit): preserve moderation privacy and recovery gates"
          git push origin HEAD:feat/issue-199-unified-audit
