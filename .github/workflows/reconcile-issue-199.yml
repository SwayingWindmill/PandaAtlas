name: Reconcile Issue 199 Mainline

on:
  push:
    branches:
      - feat/issue-199-unified-audit
    paths:
      - .github/workflows/reconcile-issue-199.yml
      - scripts/release/reconcile_issue_199.py

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Audit branch
        uses: actions/checkout@v7.0.0
        with:
          ref: feat/issue-199-unified-audit
          fetch-depth: 0

      - name: Reconcile shared files
        run: python scripts/release/reconcile_issue_199.py

      - name: Commit reconciled branch
        run: |
          rm .github/workflows/reconcile-issue-199.yml
          rm scripts/release/reconcile_issue_199.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(audit): preserve moderation privacy and recovery gates"
          git push origin HEAD:feat/issue-199-unified-audit
