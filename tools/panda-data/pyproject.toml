[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "zhipanda-panda-data"
version = "0.1.0"
description = "Independent PandaAtlas acquisition, enrichment, identity-resolution, curation, and offline artifact runtime."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
crawler = [
  "scrapling[fetchers]==0.4.8",
  "scrapy==2.17.0",
]
media = [
  "pillow>=12,<13",
]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
panda-data = "panda_data.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/panda_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/panda_data/knowledge/contracts/v1.py" = ["E501"]
