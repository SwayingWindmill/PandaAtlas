  # Backfill: walks further back once a day.
  # - adapter: douyin_api
  #   kind: account
  #   value: "<sec_user_id>"
  #   label: 成都大熊猫繁育研究基地（抖音补采）
  #   tier: backfill
  #   id: douyin_api:backfill:chengdu-base
  #   params: { max_pages: 20 }

# Each term is searched on every adapter listed. Names are the pandas fans search for most and
# that the archive (data/curation/pandas/pandas.csv) has.
keyword_groups:
  - tier: keyword
    adapters: [xhs_mcp, douyin_api]
    terms:
      - 大熊猫
      - 熊猫基地
      - 成都大熊猫繁育研究基地
      - 中国大熊猫保护研究中心
      - 福宝
      - 和花
      - 和叶
      - 萌兰
      - 七仔
      - 丫丫
      - 小奇迹
      - 宝力
      - 青宝
      - 云川
      - 鑫宝
      - 二顺
      - 盈盈
      - 美香
      - 星二

  # Phase one: the same terms through MediaCrawler, for the comparison report. Leave this group
  # in place; it only runs on a host that sets MEDIACRAWLER_DIR.
  - tier: keyword
    adapters:
      - { adapter: mediacrawler, params: { platform: xhs } }
      - { adapter: mediacrawler, params: { platform: dy } }
    terms:
      - 大熊猫
      - 福宝
      - 和花
