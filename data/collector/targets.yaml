# Collector targets. `collector sync` (and every `collector run` start) loads this file:
# targets removed here are disabled in the database, never deleted.
#
# Target fields
#   adapter           rss | bjzoo | weibo_rsshub | xhs_mcp | douyin_api | weibo_crawler | mediacrawler
#   kind              account | keyword | feed
#   value             account id, search term, feed URL, or an RSSHub route as "rsshub:/route"
#   label             name shown in alerts and as the AIHOT source name
#   tier              official | key_account | keyword | backfill   (sets the default interval)
#   interval_minutes  optional override
#   role              account targets only; who runs the account. AIHOT takes the source tier of a
#                     post from its original author's role, and fact updates apply automatically
#                     only for `institution`:
#                       institution  the institution's own account (zoos, bases, reserves)
#                       official     other official channels (iPanda, 开饭了, 熊猫守护者, 基金会)
#                       media        media and community brands
#                       fan          fan stations and individual fans
#                     Keyword and backfill targets have no role. Unknown values fail loading.
#   institution       ZhiPanda institution slug (data/curation/institutions), only for role
#                     institution. Left out while the institution is not in ZhiPanda's catalog yet.
#   (`role` and `institution` are filled by services/collector/scripts/assign_roles.py)
#   params            adapter options:
#     all             max_pages (3), empty_alert_after (per tier), timeout (subprocess seconds)
#     rss             platform: platform name to record (default "web")
#     bjzoo           value is the list page's name on www.bjzoo.com (no params)
#     weibo_rsshub    value is the Weibo uid; RSSHub's /weibo/user route, no login, latest ~10 posts
#     xhs_mcp         xsec_token (accounts, required), detail_limit (10), filters (search)
#     douyin_api      platform: douyin | bilibili (default douyin), count (20)
#     weibo_crawler   since_days (3, first run only), only_original (0)
#     mediacrawler    platform: xhs | dy | wb | bili (required), login_type (qrcode)
#
# Account ids
#   Weibo        numeric uid from https://weibo.com/u/<uid>
#   Douyin       sec_user_id from https://www.douyin.com/user/<sec_user_id>
#   Xiaohongshu  user id from https://www.xiaohongshu.com/user/profile/<id>; the xsec_token comes
#                from the same link opened from a note (…?xsec_token=…). It expires; renew it
#                when the target raises "not_found" or "login_expired".
#
# Weibo accounts were resolved and checked on 2026-11-05: each uid belongs to an account Weibo
# verifies as the institution's own (or, for iPanda and 开饭了大熊猫, the live-stream channel's).
# Douyin and Xiaohongshu ids were found the same day through a signed-in search.

